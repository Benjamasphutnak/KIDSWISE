<style>
.story-intro{border-radius:26px;padding:17px;background:linear-gradient(145deg,#d9fff0,#fff0ca);border:3px solid #fff;box-shadow:inset 0 3px 0 #fff,0 7px 0 #b9e5d2,0 12px 22px #589b7825;margin-bottom:14px}

<script id="kw-story-logic">(function(){
'use strict';
var stories=window.KW_STORIES||[], age='ทั้งหมด', query='', current=null;
var $=function(id){return document.getElementById(id)};
var favKey='kidwise.storyFavorites';
function favorites(){try{return JSON.parse(localStorage.getItem(favKey)||'[]')}catch(e){return[]}}
function saveFavorites(a){try{localStorage.setItem(favKey,JSON.stringify(a))}catch(e){}}
var filters=['ทั้งหมด','0–2 ปี','3–4 ปี','5–6 ปี','รายการโปรด'];
function renderFilters(){
 $('storyFilters').innerHTML=filters.map(function(x){return '<button type="button" class="story-filter '+(age===x?'active':'')+'" data-age="'+x+'">'+(x==='รายการโปรด'?'♥ ':'')+x+'</button>'}).join('');
 $('storyFilters').querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){age=b.dataset.age;renderFilters();renderStories()})});
}
function renderStories(){
 var fav=favorites();
 var list=stories.filter(function(s){
  var okAge=age==='ทั้งหมด'||age==='รายการโปรด'||s.age===age;
  var okFav=age!=='รายการโปรด'||fav.indexOf(s.id)>=0;
  var q=query.trim().toLowerCase();
  var okQ=!q||(s.title+' '+s.category+' '+s.text).toLowerCase().indexOf(q)>=0;
  return okAge&&okFav&&okQ;
 });
 $('storyCount').textContent='แสดง '+list.length+' จาก '+stories.length+' เรื่อง';
 $('storyGrid').innerHTML=list.length?list.map(function(s){
  var liked=fav.indexOf(s.id)>=0;
  return '<article class="story-card"><div class="story-cover" aria-hidden="true">'+s.emoji+'</div><div class="story-meta">'+s.age+' · '+s.category+'</div><h3>'+s.title+'</h3><p>'+s.text+'</p><div class="story-card-actions"><button class="story-read" type="button" data-read="'+s.id+'">เปิดอ่าน</button><button class="story-fav" type="button" data-fav="'+s.id+'" aria-label="บันทึกรายการโปรด">'+(liked?'♥':'♡')+'</button></div></article>';
 }).join(''):'<div class="story-empty">ยังไม่พบนิทาน ลองเปลี่ยนคำค้นหาหรือหมวดหมู่นะ</div>';
 $('storyGrid').querySelectorAll('[data-read]').forEach(function(b){b.addEventListener('click',function(){openStory(b.dataset.read)})});
 $('storyGrid').querySelectorAll('[data-fav]').forEach(function(b){b.addEventListener('click',function(){var a=favorites(),id=b.dataset.fav,i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);saveFavorites(a);renderStories()})});
}
function openStory(id){
 current=stories.find(function(s){return s.id===id});if(!current)return;
 $('readerEmoji').textContent=current.emoji;
 $('readerAge').textContent=current.age+' · '+current.category;
 $('readerTitle').textContent=current.title;
 $('readerText').textContent=current.text;
 $('readerLesson').textContent='ข้อคิด: '+current.lesson;
 $('readerActivity').textContent='ชวนทำต่อ: '+current.activity;
 $('storyReader').classList.add('open');
 $('storyClose').focus();
}
function closeStory(){ $('storyReader').classList.remove('open'); if(window.speechSynthesis)window.speechSynthesis.cancel() }
$('storySearch').addEventListener('input',function(){query=this.value;renderStories()});
$('storyClose').addEventListener('click',closeStory);
$('storyReader').addEventListener('click',function(e){if(e.target===$('storyReader'))closeStory()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeStory()});
$('storySpeak').addEventListener('click',function(){
 if(!current)return;
 if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){alert('อุปกรณ์นี้ยังไม่รองรับเสียงอ่าน กรุณาลองเปิดบน Chrome หรือ Safari รุ่นใหม่');return}
 window.speechSynthesis.cancel();
 var u=new SpeechSynthesisUtterance(current.title+'. '+current.text+'. ข้อคิด. '+current.lesson);
 u.lang='th-TH';u.rate=.88;u.pitch=1.05;
 var voices=window.speechSynthesis.getVoices();var th=voices.find(function(v){return /^th/i.test(v.lang)});if(th)u.voice=th;
 window.speechSynthesis.speak(u);
});
$('storyStop').addEventListener('click',function(){if(window.speechSynthesis)window.speechSynthesis.cancel()});
renderFilters();renderStories();
})();</script>
