<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c4ebf2"><title>KIDSWISE | นิทานภาพสำหรับเด็ก</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/app.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.story-wrap{max-width:540px;margin:auto;padding:10px 12px 110px}.story-top{display:flex;align-items:center;gap:10px;margin:6px 2px 14px}.story-back{border:0;border-radius:14px;width:42px;height:42px;background:#fff;box-shadow:0 4px 0 #d3e9df;font-size:22px;color:#146d56}.story-top h1{font:600 22px Mitr,sans-serif;color:#116b56;margin:0}.story-hero{border:3px solid #fff;border-radius:25px;padding:16px;background:linear-gradient(145deg,#d7fff0,#fff0c8);box-shadow:0 7px 0 #bce4d2,0 12px 22px #578c7020;margin-bottom:14px}.story-hero h2{font:600 23px Mitr,sans-serif;color:#08785e;margin:0 0 5px}.story-hero p{font-size:13px;line-height:1.6;color:#526c62;margin:0}.story-filter-row{display:flex;gap:7px;overflow-x:auto;padding:5px 2px 12px}.story-filter{white-space:nowrap;border:2px solid #fff;border-radius:18px;padding:8px 13px;background:linear-gradient(#fff,#edf8f2);box-shadow:0 3px 0 #d8e9e1;font:13px Prompt,sans-serif;color:#35534a}.story-filter.active{background:linear-gradient(#78d77a,#2da85b);color:#fff}.story-search{width:100%;box-sizing:border-box;border:2px solid #d7ebe2;border-radius:16px;padding:12px 14px;font:15px Prompt,sans-serif;background:#fff;margin:0 0 12px}.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.story-card{border:2px solid #fff;border-radius:22px;padding:10px;background:linear-gradient(150deg,#fff,#effbf6);box-shadow:0 6px 0 #d4ebdf,0 10px 16px #548f7020;display:flex;flex-direction:column;gap:6px;min-width:0}.story-thumb{width:100%;height:118px;object-fit:cover;border-radius:16px;box-shadow:0 4px 0 #c7e6d4;animation:floaty 4s ease-in-out infinite}.story-card h3{font:600 15px/1.35 Mitr,sans-serif;color:#214d3e;margin:2px 0}.story-meta{font-size:11px;color:#647d73}.story-desc{font-size:12px;line-height:1.55;color:#53675f;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.story-card button{border:0;border-radius:13px;padding:9px;color:#fff;background:linear-gradient(#ffb24a,#f47a12);box-shadow:0 4px 0 #d96a10;font:500 14px Prompt,sans-serif;margin-top:auto}.story-reader{position:fixed;inset:0;z-index:200;background:linear-gradient(180deg,#d2f5f0,#f9fff8);display:none;overflow-y:auto}.story-reader.open{display:block}.reader-inner{max-width:540px;margin:auto;padding:10px 14px 30px;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column}.reader-head{display:flex;align-items:center;gap:10px;padding:5px 0 10px}.reader-head button{border:0;border-radius:13px;background:#fff;width:42px;height:42px;font-size:22px;color:#166c56;box-shadow:0 4px 0 #d4e9df}.reader-head strong{font:500 15px Prompt,sans-serif;color:#32675a;flex:1}.reader-progress{height:8px;background:#e4f0e9;border-radius:20px;overflow:hidden;margin-bottom:12px}.reader-progress span{display:block;height:100%;background:linear-gradient(90deg,#30c49c,#ffb443);border-radius:20px;transition:width .25s}.reader-book{border:3px solid #fff;border-radius:27px;background:linear-gradient(155deg,#fff,#f2fff8);box-shadow:0 8px 0 #c5e7d6,0 14px 28px #52876a20;padding:12px;flex:1;display:flex;flex-direction:column}.reader-art-wrap{position:relative;overflow:hidden;border-radius:20px;background:#e6f8e8}.reader-art{width:100%;height:clamp(210px,38vh,330px);object-fit:cover;display:block;animation:floaty 5s ease-in-out infinite}.reader-spark{position:absolute;right:12px;top:8px;font-size:25px;animation:spark 2s ease-in-out infinite}.reader-page-label{font-size:11px;color:#739084;margin:14px 3px 3px}.reader-title{font:600 22px/1.4 Mitr,sans-serif;color:#08785e;margin:0 3px 8px}.reader-text{font:17px/2 Prompt,sans-serif;color:#314e43;margin:0 3px 12px;white-space:pre-line}.reader-lesson{background:linear-gradient(120deg,#fff0c9,#fff9e9);border-radius:17px;padding:12px;font:14px/1.7 Prompt,sans-serif;color:#77521b;margin-top:auto}.reader-controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-top:14px}.reader-controls button{border:0;border-radius:15px;min-height:46px;font:500 14px Prompt,sans-serif}.reader-prev,.reader-next{background:#fff;color:#176a55;box-shadow:0 4px 0 #cce5d8}.reader-play{background:linear-gradient(#ffb64c,#f47b13);color:#fff;box-shadow:0 4px 0 #d5660b}.reader-extra{display:flex;justify-content:center;gap:8px;margin-top:9px}.reader-extra button{border:0;border-radius:13px;background:#fff;padding:8px 13px;color:#3b685a;font:13px Prompt,sans-serif;box-shadow:0 3px 0 #dcebe3}.story-empty{text-align:center;padding:25px;color:#6b8178;grid-column:1/-1}@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes spark{0%,100%{transform:scale(.9) rotate(-8deg)}50%{transform:scale(1.15) rotate(8deg)}}
@media(max-width:360px){.story-grid{grid-template-columns:1fr}.story-thumb{height:150px}.reader-text{font-size:16px}}
</style></head><body><main class="phone kw-page"><div class="kw-status"></div><div class="story-wrap"><header class="story-top"><button class="story-back" onclick="location.href='index.html'" aria-label="กลับหน้าหลัก">‹</button><div><h1>นิทานภาพแสนสนุก</h1><div class="story-meta">อ่านทีละหน้า • ฟังเสียงเล่า • เรียนรู้ไปด้วยกัน</div></div></header><section class="story-hero"><div style="font-size:32px">📚🌈✨</div><h2>โลกนิทานแสนสนุก</h2><p>นิทานเป็นเรื่อง ๆ มีภาพการ์ตูนประกอบ ตัวหนังสืออ่านง่าย และเสียงเล่านิทานภาษาไทย</p></section><input id="storySearch" class="story-search" type="search" placeholder="🔎 ค้นหาชื่อนิทานหรือหมวดหมู่"><div id="storyFilters" class="story-filter-row"></div><div id="storyCount" class="story-meta" style="margin:0 4px 9px"></div><section id="storyGrid" class="story-grid"></section></div><nav id="kw-nav" class="kw-nav kw-nav-sticky" aria-label="เมนูด้านล่าง"></nav></main>
<section id="storyReader" class="story-reader" role="dialog" aria-modal="true" aria-label="อ่านนิทาน"><div class="reader-inner"><header class="reader-head"><button id="readerClose" aria-label="ปิดนิทาน">×</button><strong id="readerCounter">หน้า 1 จาก 4</strong><button id="readerFavorite" aria-label="บันทึกนิทาน">♡</button></header><div class="reader-progress"><span id="readerProgress" style="width:25%"></span></div><article class="reader-book"><div class="reader-art-wrap"><img id="readerArt" class="reader-art" src="" alt="ภาพประกอบนิทาน"><span class="reader-spark">✨</span></div><div id="readerPageLabel" class="reader-page-label">หน้า 1</div><h2 id="readerTitle" class="reader-title"></h2><p id="readerText" class="reader-text"></p><div id="readerLesson" class="reader-lesson" hidden></div></article><div class="reader-controls"><button id="readerPrev" class="reader-prev">ย้อนกลับ</button><button id="readerPlay" class="reader-play">🔊 ฟังหน้านี้</button><button id="readerNext" class="reader-next">หน้าถัดไป ›</button></div><div class="reader-extra"><button id="readerSlower">เสียงช้าลง</button><button id="readerFaster">เสียงเร็วขึ้น</button><button id="readerStop">หยุดเสียง</button></div></div></section>
