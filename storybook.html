<script src="js/data.js"></script><script src="js/app.js"></script><script>window.KW_STORIES=[{"id":"story-01","title":"กระต่ายน้อยกับแครอทแบ่งปัน","age":"0–2 ปี","category":"น้ำใจ","emoji":"🐰","text":"กระต่ายน้อยพบลูกกระรอกที่หิว จึงแบ่งแครอทครึ่งหนึ่งให้เพื่อน ทั้งสองยิ้มให้กันและนั่งกินด้วยกันอย่างมีความสุข","lesson":"การแบ่งปันทำให้ทั้งผู้ให้และผู้รับมีความสุข","activity":"ชวนเด็กชี้ภาพกระต่ายและพูดคำว่า “แบ่งปัน”","pages":["เช้าวันหนึ่งในป่าเขียวสดใส กระต่ายน้อยตื่นขึ้นมาแล้วออกไปเดินเล่นใต้ต้นไม้ใหญ่ วันนี้มันพกตะกร้าใบเล็กมาด้วย เพราะตั้งใจจะหาแครอทหวาน ๆ กลับไปกินที่บ้าน ระหว่างทางมันฮัมเพลงอย่างมีความสุข","ไม่นาน กระต่ายน้อยก็พบแครอทสีส้มอวบอยู่ข้างแปลงผัก มันดึงขึ้นมาอย่างระมัดระวัง แล้วปัดดินออกเบา ๆ “ว้าว! แครอทหัวใหญ่มากเลย” กระต่ายน้อยยิ้มกว้าง ขณะกำลังคิดว่าจะนำไปทำอาหารอะไร ก็ได้ยินเสียงท้องร้องเบา ๆ จากหลังพุ่มไม้","ตรงนั้นคือลูกกระรอกตัวเล็กที่ยังไม่ได้กินอาหารเช้า กระต่ายน้อยมองแครอทในมือ แล้วมองเพื่อนที่ดูหิว มันคิดอยู่ครู่หนึ่งก่อนยิ้มและพูดว่า “เรามาแบ่งกันนะ” กระต่ายน้อยใช้มือเล็ก ๆ หักแครอทออกเป็นสองส่วน แล้วยื่นส่วนหนึ่งให้ลูกกระรอก","ลูกกระรอกรับแครอทด้วยความดีใจ “ขอบคุณมากนะ” ทั้งสองนั่งกินด้วยกันใต้ร่มไม้ แครอทหวานกรอบอร่อยเป็นพิเศษเมื่อได้แบ่งกับเพื่อน กระต่ายน้อยเดินกลับบ้านด้วยหัวใจที่อบอุ่น และรู้ว่าความสุขบางอย่างยิ่งแบ่งปันก็ยิ่งเพิ่มขึ้น"],"art":"assets/story-scenes/rabbit-squirrel.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-02","title":"เมฆปุยนุ่ม","age":"0–2 ปี","category":"ธรรมชาติ","emoji":"☁️","text":"เมฆก้อนเล็กลอยบนฟ้า มองเห็นต้นไม้ดื่มน้ำฝน เมฆจึงค่อย ๆ ปล่อยหยดน้ำลงมา ดอกไม้เงยหน้ารับน้ำแล้วบานสดใส","lesson":"ธรรมชาติช่วยดูแลสิ่งมีชีวิต","activity":"ชวนเด็กทำเสียง “ซ่า ๆ” เหมือนฝน","pages":["บนท้องฟ้าสีฟ้ามีเมฆก้อนเล็กนุ่มฟูชื่อปุย ปุยชอบลอยดูโลกข้างล่าง ทุกวันมันมองเห็นต้นไม้ ดอกไม้ และเจ้าสัตว์ตัวน้อยเล่นกันอย่างสนุกสนาน","วันหนึ่งปุยสังเกตเห็นต้นกล้าต้นหนึ่งก้มใบลง ดินรอบ ๆ แห้งและแตกระแหง ปุยจึงลอยเข้าไปใกล้และถามว่า “ต้นกล้าเป็นอะไรหรือจ๊ะ” ต้นกล้าตอบเบา ๆ ว่า “ฉันกำลังกระหายน้ำ”","ปุยอยากช่วยมาก มันรวบรวมละอองน้ำเล็ก ๆ ในตัว แล้วค่อย ๆ ปล่อยหยดฝนลงมา เปาะแปะ เปาะแปะ หยดน้ำตกลงบนดิน ต้นกล้าดูดน้ำเข้าไปจนใบค่อย ๆ ตั้งขึ้น ดอกไม้ข้าง ๆ ก็เงยหน้ารับฝนด้วย","เมื่อฝนหยุด แสงแดดอ่อน ๆ ส่องผ่านก้อนเมฆ เกิดรุ้งสีสวยบนฟ้า ต้นกล้าขอบคุณปุย ปุยยิ้มอย่างภูมิใจที่ได้ช่วยชีวิตเล็ก ๆ ให้สดชื่นอีกครั้ง"],"art":"assets/story-scenes/cloud-sprout.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-03","title":"ลูกเป็ดตามหาแม่","age":"0–2 ปี","category":"ครอบครัว","emoji":"🦆","text":"ลูกเป็ดเดินตามเสียงแม่ “ก้าบ ก้าบ” เมื่อเห็นแม่ก็รีบเดินเข้าไปซบปีก แม่กอดลูกเป็ดไว้แน่น","lesson":"เมื่อไม่แน่ใจ ให้มองหาผู้ใหญ่ที่ไว้ใจได้","activity":"ชี้ภาพแม่เป็ดกับลูกเป็ดและเรียกชื่อ","pages":["ริมบึงที่มีดอกบัวบาน ลูกเป็ดตัวเหลืองชื่อปุ๊กลุกเดินเล่นอยู่ใกล้แม่ มันชอบดูเงาตัวเองบนผิวน้ำและฟังเสียงนกที่ร้องอยู่บนต้นไม้","ขณะมองผีเสื้อบินผ่าน ปุ๊กลุกเดินตามไปทีละนิดจนมองไม่เห็นแม่ เมื่อหันกลับมา รอบตัวมีแต่ต้นหญ้าและดอกไม้ ลูกเป็ดเริ่มกังวลและร้อง “ก้าบ ๆ แม่อยู่ไหน”","แม่เป็ดได้ยินเสียงลูกจึงร้องตอบจากริมบึง ปุ๊กลุกหยุดเดินและตั้งใจฟัง มันไม่วิ่งไปไกล แต่ยืนรอในที่ปลอดภัยพร้อมร้องเรียกอีกครั้ง ไม่นานแม่เป็ดก็เดินมาหา","แม่กางปีกโอบลูกไว้ ปุ๊กลุกซบอกแม่อย่างโล่งใจ แม่บอกว่า “ถ้าหนูมองไม่เห็นแม่ ให้หยุดอยู่กับที่และเรียกแม่หรือผู้ใหญ่ที่ไว้ใจได้นะ” ลูกเป็ดพยักหน้า แล้วเดินกลับบ้านเคียงข้างแม่"],"art":"assets/story-scenes/duck-family.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-04","title":"บอลสีแดงของหมีน้อย","age":"0–2 ปี","category":"การเรียนรู้","emoji":"🐻","text":"หมีน้อยกลิ้งบอลสีแดงไปข้างหน้า บอลกลิ้งช้า ๆ แล้วหยุดใกล้ต้นไม้ หมีน้อยเดินไปหยิบและกลิ้งอีกครั้ง","lesson":"การเล่นช่วยให้เราเรียนรู้","activity":"ชวนเด็กกลิ้งลูกบอลนุ่ม ๆ ไปมา","pages":["หมีน้อยชื่อบ๊อบบี้มีลูกบอลสีแดงสดใสเป็นของเล่นชิ้นโปรด ทุกเช้ามันจะนำบอลออกไปเล่นที่สนามหญ้าหน้าบ้าน","วันนี้บ๊อบบี้ลองกลิ้งบอลแรงขึ้น บอลกลิ้งผ่านดอกไม้ ผ่านก้อนหิน แล้วไปหยุดอยู่ใกล้ต้นไม้ใหญ่ บ๊อบบี้รีบเดินตามไป แต่บอลอยู่ไกลกว่าที่คิด","บ๊อบบี้ค่อย ๆ เดินอ้อมก้อนหินและก้มเก็บบอลขึ้นมา มันลองกลิ้งอีกครั้ง คราวนี้บอลกลิ้งไปหาเพื่อนกระรอก กระรอกช่วยส่งบอลกลับมาให้ ทั้งสองจึงผลัดกันกลิ้งบอลไปมา","บ๊อบบี้หัวเราะอย่างสนุกสนาน มันได้เรียนรู้ว่าการเล่นซ้ำ ๆ ช่วยให้ฝึกการกะระยะและการเคลื่อนไหว และเมื่อเล่นกับเพื่อนก็ยิ่งสนุกขึ้น"],"art":"assets/story-scenes/bear-ball.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-05","title":"พระจันทร์บอกฝันดี","age":"0–2 ปี","category":"ก่อนนอน","emoji":"🌙","text":"พระจันทร์ยิ้มอยู่บนฟ้า ดาวดวงเล็กกระพริบแสง นกน้อยหลับในรัง กระต่ายน้อยห่มผ้าแล้วหลับตา","lesson":"การพักผ่อนช่วยให้ร่างกายเติบโต","activity":"อ่านช้า ๆ ด้วยเสียงนุ่มก่อนนอน","pages":["วันนี้ พระจันทร์บอกฝันดี เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🌙 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: พระจันทร์ยิ้มอยู่บนฟ้า ดาวดวงเล็กกระพริบแสง นกน้อยหลับในรัง กระต่ายน้อยห่มผ้าแล้วหลับตา ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า การพักผ่อนช่วยให้ร่างกายเติบโต"],"art":"assets/story-scenes/friends-bridge.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-06","title":"ดอกทานตะวันยิ้ม","age":"0–2 ปี","category":"ธรรมชาติ","emoji":"🌻","text":"ดอกทานตะวันหันหน้าไปทางแสงแดด ผีเสื้อบินมาเยี่ยมและโบกปีกเบา ๆ ดอกไม้ไหวตามสายลม","lesson":"สังเกตสิ่งเล็ก ๆ รอบตัวได้ทุกวัน","activity":"ชวนเด็กทำมือเป็นผีเสื้อ","pages":["วันนี้ ดอกทานตะวันยิ้ม เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🌻 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: ดอกทานตะวันหันหน้าไปทางแสงแดด ผีเสื้อบินมาเยี่ยมและโบกปีกเบา ๆ ดอกไม้ไหวตามสายลม ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า สังเกตสิ่งเล็ก ๆ รอบตัวได้ทุกวัน"],"art":"assets/story-scenes/cloud-sprout.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-07","title":"เจ้าหอยทากใจเย็น","age":"0–2 ปี","category":"อารมณ์","emoji":"🐌","text":"หอยทากค่อย ๆ คลานไปตามใบไม้ แมลงเต่าทองรีบวิ่งผ่าน แต่หอยทากไม่รีบร้อนและเดินต่อจนถึงหยดน้ำ","lesson":"แต่ละคนเรียนรู้ในจังหวะของตัวเอง","activity":"พูดคำว่า “ช้า ๆ” พร้อมทำท่ามือ","pages":["วันนี้ เจ้าหอยทากใจเย็น เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🐌 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: หอยทากค่อย ๆ คลานไปตามใบไม้ แมลงเต่าทองรีบวิ่งผ่าน แต่หอยทากไม่รีบร้อนและเดินต่อจนถึงหยดน้ำ ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า แต่ละคนเรียนรู้ในจังหวะของตัวเอง"],"art":"assets/story-scenes/turtle-rainbow.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-08","title":"มือเล็กช่วยเก็บ","age":"0–2 ปี","category":"กิจวัตร","emoji":"🧸","text":"หลังเล่นเสร็จ ตุ๊กตาหมีชวนเด็กน้อยเก็บบล็อกใส่กล่องทีละชิ้น เมื่อห้องเรียบร้อย ทั้งคู่ปรบมือให้กัน","lesson":"การเก็บของเป็นเรื่องที่ฝึกได้","activity":"ชวนเด็กเก็บของเล่นหนึ่งชิ้น","pages":["วันนี้ มือเล็กช่วยเก็บ เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🧸 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: หลังเล่นเสร็จ ตุ๊กตาหมีชวนเด็กน้อยเก็บบล็อกใส่กล่องทีละชิ้น เมื่อห้องเรียบร้อย ทั้งคู่ปรบมือให้กัน ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า การเก็บของเป็นเรื่องที่ฝึกได้"],"art":"assets/story-scenes/bear-ball.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-09","title":"เสียงอะไรเอ่ย","age":"0–2 ปี","category":"ภาษา","emoji":"🐸","text":"กบร้อง “อ๊บ อ๊บ” นกร้อง “จิ๊บ จิ๊บ” และแมวร้อง “เหมียว” เด็กน้อยฟังแล้วหัวเราะและลองทำเสียงตาม","lesson":"การฟังและเลียนเสียงช่วยฝึกภาษา","activity":"ชวนเด็กเลียนเสียงสัตว์","pages":["วันนี้ เสียงอะไรเอ่ย เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🐸 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: กบร้อง “อ๊บ อ๊บ” นกร้อง “จิ๊บ จิ๊บ” และแมวร้อง “เหมียว” เด็กน้อยฟังแล้วหัวเราะและลองทำเสียงตาม ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า การฟังและเลียนเสียงช่วยฝึกภาษา"],"art":"assets/story-scenes/friends-bridge.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-10","title":"กอดอุ่นของแม่","age":"0–2 ปี","category":"ความรัก","emoji":"💚","text":"เมื่อลูกน้อยรู้สึกกลัว แม่อุ้มขึ้นมากอดและพูดเบา ๆ ว่า “แม่อยู่นี่นะ” ลูกค่อย ๆ สงบและยิ้มอีกครั้ง","lesson":"ความอบอุ่นช่วยให้เด็กรู้สึกปลอดภัย","activity":"กอดเด็กเบา ๆ หากเด็กต้องการ","pages":["วันนี้ กอดอุ่นของแม่ เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 💚 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: เมื่อลูกน้อยรู้สึกกลัว แม่อุ้มขึ้นมากอดและพูดเบา ๆ ว่า “แม่อยู่นี่นะ” ลูกค่อย ๆ สงบและยิ้มอีกครั้ง ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า ความอบอุ่นช่วยให้เด็กรู้สึกปลอดภัย"],"art":"assets/story-scenes/duck-family.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-11","title":"เต่าตัวน้อยไม่ยอมแพ้","age":"3–4 ปี","category":"ความพยายาม","emoji":"🐢","text":"เต่าน้อยอยากปีนเนินเขา ครั้งแรกมันลื่นลงมา เพื่อนชวนให้ลองอีกครั้ง เต่าค่อย ๆ ก้าวทีละก้าวจนถึงยอดเนิน","lesson":"ความพยายามทีละนิดช่วยให้เราทำสิ่งยากได้","activity":"ถามว่าเต่าทำอย่างไรจึงขึ้นถึงยอด","pages":["วันนี้ เต่าตัวน้อยไม่ยอมแพ้ เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🐢 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: เต่าน้อยอยากปีนเนินเขา ครั้งแรกมันลื่นลงมา เพื่อนชวนให้ลองอีกครั้ง เต่าค่อย ๆ ก้าวทีละก้าวจนถึงยอดเนิน ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า ความพยายามทีละนิดช่วยให้เราทำสิ่งยากได้"],"art":"assets/story-scenes/turtle-rainbow.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-12","title":"สีรุ้งของเพื่อน","age":"3–4 ปี","category":"มิตรภาพ","emoji":"🌈","text":"เด็กสามคนวาดภาพด้วยกัน คนหนึ่งชอบสีแดง อีกคนชอบสีฟ้า และอีกคนชอบสีเหลือง เมื่อรวมภาพเข้าด้วยกันก็เกิดรุ้งสีสวย","lesson":"เพื่อนแต่ละคนมีความชอบต่างกันได้","activity":"ชวนเด็กบอกสีที่ชอบ","pages":["วันนี้ สีรุ้งของเพื่อน เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🌈 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: เด็กสามคนวาดภาพด้วยกัน คนหนึ่งชอบสีแดง อีกคนชอบสีฟ้า และอีกคนชอบสีเหลือง เมื่อรวมภาพเข้าด้วยกันก็เกิดรุ้งสีสวย ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า เพื่อนแต่ละคนมีความชอบต่างกันได้"],"art":"assets/story-scenes/friends-bridge.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-13","title":"กระเป๋าของน้องฟ้า","age":"3–4 ปี","category":"ความรับผิดชอบ","emoji":"🎒","text":"น้องฟ้าเตรียมกระเป๋าไปโรงเรียน เธอใส่ขวดน้ำ สมุด และกล่องดินสอตามรายการ แล้วตรวจอีกครั้งก่อนออกจากบ้าน","lesson":"การเตรียมของช่วยให้เรารับผิดชอบตัวเอง","activity":"ชวนเด็กเลือกของ 2 อย่างใส่กระเป๋า","pages":["วันนี้ กระเป๋าของน้องฟ้า เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🎒 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: น้องฟ้าเตรียมกระเป๋าไปโรงเรียน เธอใส่ขวดน้ำ สมุด และกล่องดินสอตามรายการ แล้วตรวจอีกครั้งก่อนออกจากบ้าน ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ 7 นาที"},{"id":"story-19","title":"วันที่ลมแรง","age":"3–4 ปี","category":"ความปลอดภัย","emoji":"🍃","text":"ลมพัดแรงจนหมวกของน้องปลิว คุณพ่อจับมือน้องไว้และพาเดินห่างจากกิ่งไม้ใหญ่ ทั้งคู่รอจนลมเบาลง","lesson":"เมื่ออยู่กลางแจ้งควรอยู่ใกล้ผู้ดูแลและระวังสิ่งรอบตัว","activity":"ถามเด็กว่าควรเดินกับใครเมื่อมีลมแรง","pages":["วันนี้ วันที่ลมแรง เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🍃 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: ลมพัดแรงจนหมวกของน้องปลิว คุณพ่อจับมือน้องไว้และพาเดินห่างจากกิ่งไม้ใหญ่ ทั้งคู่รอจนลมเบาลง ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า เมื่ออยู่กลางแจ้งควรอยู่ใกล้ผู้ดูแลและระวังสิ่งรอบตัว"],"art":"assets/story-scenes/friends-bridge.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-20","title":"ฟันสะอาดของกระต่าย","age":"3–4 ปี","category":"สุขนิสัย","emoji":"🪥","text":"กระต่ายน้อยแปรงฟันตอนเช้าและก่อนนอน โดยมีคุณแม่ช่วยดูให้ทั่วทุกซี่ เมื่อเสร็จแล้วกระต่ายยิ้มกว้าง","lesson":"แปรงฟันสม่ำเสมอช่วยดูแลฟัน","activity":"ชวนเด็กทำท่าแปรงฟันเป็นวงกลม","pages":["วันนี้ ฟันสะอาดของกระต่าย เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🪥 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: กระต่ายน้อยแปรงฟันตอนเช้าและก่อนนอน โดยมีคุณแม่ช่วยดูให้ทั่วทุกซี่ เมื่อเสร็จแล้วกระต่ายยิ้มกว้าง ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้น มเมื่อได้อ่านข้อความ ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า คำพูดดี ๆ ทำให้คนรอบข้างรู้สึกดี"],"art":"assets/story-scenes/friends-bridge.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-23","title":"เจ้ากระรอกวางแผน","age":"5–6 ปี","category":"การวางแผน","emoji":"🐿️","text":"กระรอกอยากจัดงานเล็ก ๆ ให้เพื่อน มันเขียนรายการสิ่งที่ต้องเตรียม แบ่งงานกับเพื่อน และตรวจดูทีละข้อจนงานสำเร็จ","lesson":"การวางแผนช่วยให้งานสำเร็จเป็นขั้นตอน","activity":"ชวนเด็กวางแผนกิจกรรมง่าย ๆ","pages":["วันนี้ เจ้ากระรอกวางแผน เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🐿️ ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: กระรอกอยากจัดงานเล็ก ๆ ให้เพื่อน มันเขียนรายการสิ่งที่ต้องเตรียม แบ่งงานกับเพื่อน และตรวจดูทีละข้อจนงานสำเร็จ ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า การวางแผนช่วยให้งานสำเร็จเป็นขั้นตอน"],"art":"assets/story-scenes/friends-bridge.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-24","title":"สะพานของทุกคน","age":"5–6 ปี","category":"การทำงานร่วมกัน","emoji":"🌉","text":"สัตว์ในป่าต้องข้ามลำธาร จึงช่วยกันต่อสะพานจากไม้ที่ปลอดภัย ตัวหนึ่งหาไม้ อีกตัวช่วยวาง และอีกตัวตรวจความแข็งแรง","lesson":"เมื่อร่วมมือกัน ทุกคนช่วยให้งานสำเร็จได้","activity":"ถามว่าเด็กอยากช่วยงานส่ว ระมาณ 6–8 นาที"},{"id":"story-26","title":"วันที่อารมณ์เป็นเมฆฝน","age":"5–6 ปี","category":"อารมณ์","emoji":"🌧️","text":"พลอยโกรธเมื่อสร้างภาพไม่สำเร็จ เธอหยุดพัก หายใจช้า ๆ แล้วลองใหม่ เมื่อยังยากอยู่ก็ขอให้คุณครูช่วย","lesson":"เรารู้สึกโกรธหรือผิดหวังได้ และเรียนรู้วิธีดูแลใจตัวเองได้","activity":"ฝึกหายใจเข้าช้า ๆ และผ่อนออก","pages":["วันนี้ วันที่อารมณ์เป็นเมฆฝน เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🌧️ ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: พลอยโกรธเมื่อสร้างภาพไม่สำเร็จ เธอหยุดพัก หายใจช้า ๆ แล้วลองใหม่ เมื่อยังยากอยู่ก็ขอให้คุณครูช่วย ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า เรารู้สึกโกรธหรือผิดหวังได้ และเรียนรู้วิธีดูแลใจตัวเองได้"],"art":"assets/story-scenes/cloud-sprout.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-27","title":"ตลาดนัดตัวเลข","age":"5–6 ปี","category":"คณิตศาสตร์","emoji":"🍎","text":"น้องต้นไปตลาดกับคุณพ่อ ช่วยนับแอปเปิลห้าลูกและกล้วยสามผล จากนั้นช่วยตรวจว่าซื้อผลไม้ครบตามรายการหรือยัง","lesson":"การนับเลขฝึกได้จากชีวิตประจำวัน","activity":"ชวนเด็กนับผลไม้หรือของใช้","pages":["วันนี้ ตลาดนัดตัวเลข เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🍎 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: น้องต้นไปตลาดกับคุณพ่อ ช่วยนับแอปเปิลห้าลูกและกล้วยสามผล จากนั้นช่วยตรวจว่าซื้อผลไม้ครบตามรายการหรือยัง ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า การนับเลขฝึกได้จากชีวิตประจำวัน"],"art":"assets/story-scenes/friends-bridge.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-28","title":"โลกสะอาดเริ่มที่เรา","age":"5–6 ปี","category":"สิ่งแวดล้อม","emoji":"♻️","text":"หลังปิกนิก เด็ก ๆ ช่วยกันเก็บขยะ แยกขวด กระดาษ และเศษอาหาร ก่อนกลับทุกคนตรวจดูว่าพื้นที่สะอาดแล้ว","lesson":"เราช่วยดูแลสิ่งแวดล้อมได้จากเรื่องเล็ก ๆ","activity":"ชวนเด็กแยกขยะที่บ้านตามระบบของครอบครัว","pages":["วันนี้ โลกสะอาดเริ่มที่เรา เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา ♻️ ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: หลังปิกนิก เด็ก ๆ ช่วยกันเก็บขยะ แยกขวด กระดาษ และเศษอาหาร ก่อนกลับทุกคนตรวจดูว่าพื้นที่สะอาดแล้ว ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า เราช่วยดูแลสิ่งแวดล้อมได้จากเรื่องเล็ก ๆ"],"art":"assets/story-scenes/cloud-sprout.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-29","title":"ความลับของเงา","age":"5–6 ปี","category":"วิทยาศาสตร์","emoji":"🔦","text":"พีทส่องไฟฉายไปที่ตุ๊กตาแล้วเห็นเงาบนผนัง เขาขยับไฟฉายใกล้และไกล เงาก็เปลี่ยนขนาด เขาจดสิ่งที่สังเกตได้","lesson":"การทดลองและสังเกตช่วยให้เราเข้าใจสิ่งรอบตัว","activity":"ทดลองทำเงาด้วยไฟฉายโดยมีผู้ใหญ่ดูแล","pages":["วันนี้ ความลับของเงา เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🔦 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: พีทส่องไฟฉายไปที่ตุ๊กตาแล้วเห็นเงาบนผนัง เขาขยับไฟฉายใกล้และไกล เงาก็เปลี่ยนขนาด เขาจดสิ่งที่สังเกตได้ ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า การทดลองและสังเกตช่วยให้เราเข้าใจสิ่งรอบตัว"],"art":"assets/story-scenes/turtle-rainbow.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-30","title":"คำสัญญาของเพื่อน","age":"5–6 ปี","category":"ความรับผิดชอบ","emoji":"🤝","text":"ข้าวปั้นสัญญาว่าจะคืนหนังสือให้เพื่อนในวันศุกร์ เขาจึงวางหนังสือไว้ในกระเป๋าตั้งแต่คืนก่อน และนำไปคืนตามที่พูดไว้","lesson":"การรักษาคำพูดสร้างความไว้วางใจ","activity":"ถามเด็กว่ามีเรื่องเล็ก ๆ อะไรที่อยากรับผิดชอบ","pages":["วันนี้ คำสัญญาของเพื่อน เริ่มต้นขึ้นในเช้าวันสดใส ตัวละครของเรา 🤝 ออกไปพบโลกกว้างด้วยความอยากรู้อยากเห็น มันมองไปรอบ ๆ อย่างตั้งใจและคิดว่าวันนี้อาจมีเรื่องพิเศษเกิดขึ้น","ระหว่างทางเกิดเหตุการณ์หนึ่งขึ้น: ข้าวปั้นสัญญาว่าจะคืนหนังสือให้เพื่อนในวันศุกร์ เขาจึงวางหนังสือไว้ในกระเป๋าตั้งแต่คืนก่อน และนำไปคืนตามที่พูดไว้ ตัวละครของเราหยุดคิดและสังเกตสิ่งที่เกิดขึ้น มันรู้ว่าปัญหานี้ต้องใช้ความใจเย็นและการลองหาวิธีที่เหมาะสม","ตัวละครค่อย ๆ ลงมือทำทีละขั้น โดยไม่รีบร้อน หากทำไม่ได้ในครั้งแรกก็ลองใหม่ หรือขอความช่วยเหลือจากเพื่อนและผู้ใหญ่ที่ไว้ใจได้ ระหว่างนั้นมันได้เรียนรู้สิ่งใหม่เกี่ยวกับตัวเองและคนรอบข้าง","ในที่สุดเรื่องราวก็จบลงด้วยรอยยิ้ม ทุกคนได้ประสบการณ์ที่มีค่าและเข้าใจกันมากขึ้น เรื่องนี้ชวนให้เราจำไว้ว่า การรักษาคำพูดสร้างความไว้วางใจ"],"art":"assets/story-scenes/friends-bridge.jpg","durationLabel":"ประมาณ 6–8 นาที"}];</script><script>
(function(){
'use strict';
var stories=window.KW_STORIES||[],age='ทั้งหมด',query='',current=null,page=0,rate=.88;
var $=function(id){return document.getElementById(id)};
var favKey='kidwise.storyFavorites';
function favs(){try{return JSON.parse(localStorage.getItem(favKey)||'[]')}catch(e){return[]}}
function save(a){try{localStorage.setItem(favKey,JSON.stringify(a))}catch(e){}}
var filters=['ทั้งหมด','0–2 ปี','3–4 ปี','5–6 ปี','รายการโปรด'];
function renderFilters(){
 var el=$('storyFilters'); if(!el)return;
 el.innerHTML=filters.map(function(x){return '<button type="button" class="story-filter '+(age===x?'active':'')+'" data-age="'+x+'">'+(x==='รายการโปรด'?'♥ ':'')+x+'</button>'}).join('');
 el.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){age=b.dataset.age;renderFilters();render()})});
}
function render(){
 var grid=$('storyGrid'); if(!grid)return;
 var f=favs(),list=stories.filter(function(s){
  var q=query.toLowerCase().trim();
  return (age==='ทั้งหมด'||age==='รายการโปรด'||s.age===age) &&
   (age!=='รายการโปรด'||f.indexOf(s.id)>=0) &&
   (!q||(s.title+' '+s.category+' '+s.text).toLowerCase().indexOf(q)>=0);
 });
 $('storyCount').textContent='แสดง '+list.length+' จาก '+stories.length+' เรื่อง';
 grid.innerHTML=list.length?list.map(function(s){
  var art=s.art||'assets/story-scenes/rabbit-squirrel.jpg';
  var duration=s.durationLabel||'อ่านประมาณ 5 นาที';
  return '<article class="story-card"><img class="story-thumb" loading="lazy" src="'+art+'" alt="ภาพประกอบ '+s.title+'"><div class="story-meta">'+s.age+' · '+s.category+' · '+duration+'</div><h3>'+s.title+'</h3><p class="story-desc">'+((s.pages&&s.pages[0])||s.text||'')+'</p><button type="button" data-open="'+s.id+'">📖 เปิดอ่านนิทาน</button></article>';
 }).join(''):'<div class="story-empty">ยังไม่พบนิทาน ลองเปลี่ยนคำค้นหานะ</div>';
 grid.querySelectorAll('[data-open]').forEach(function(b){b.addEventListener('click',function(){open(b.dataset.open)})});
}
function speak(text){
 if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){alert('อุปกรณ์นี้ไม่รองรับเสียงอ่าน');return}
 window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='th-TH';u.rate=rate;u.pitch=1.05;
 var v=window.speechSynthesis.getVoices().find(function(x){return /^th/i.test(x.lang)});if(v)u.voice=v;
 window.speechSynthesis.speak(u);
}
function draw(){
 var pages=current.pages||[current.text],total=pages.length;
 $('readerCounter').textContent='หน้า '+(page+1)+' จาก '+total;
 $('readerProgress').style.width=((page+1)/total*100)+'%';
 $('readerArt').src=current.art||'assets/story-scenes/rabbit-squirrel.jpg';
 $('readerArt').alt='ภาพการ์ตูนประกอบเรื่อง '+current.title;
 $('readerPageLabel').textContent='หน้า '+(page+1)+' · '+current.age;
 $('readerTitle').textContent=current.title;$('readerText').textContent=pages[page];
 $('readerLesson').hidden=page!==total-1;
 $('readerLesson').textContent='💡 ข้อคิด: '+current.lesson+'\n\nชวนทำต่อ: '+current.activity;
 $('readerPrev').disabled=page===0;$('readerPrev').style.opacity=page===0?'.45':'1';
 $('readerNext').textContent=page===total-1?'อ่านจบแล้ว ✓':'หน้าถัดไป ›';
 $('readerFavorite').textContent=favs().includes(current.id)?'♥':'♡';
}
function open(id){current=stories.find(function(s){return s.id===id});if(!current)return;page=0;$('storyReader').classList.add('open');document.body.style.overflow='hidden';draw()}
function close(){if(window.speechSynthesis)window.speechSynthesis.cancel();$('storyReader').classList.remove('open');document.body.style.overflow=''}
$('storySearch').addEventListener('input',function(){query=this.value;render()});
$('readerClose').addEventListener('click',close);
$('readerPrev').addEventListener('click',function(){if(page>0){page--;if(window.speechSynthesis)window.speechSynthesis.cancel();draw()}});
$('readerNext').addEventListener('click',function(){if(page<(current.pages.length-1)){page++;if(window.speechSynthesis)window.speechSynthesis.cancel();draw()}else close()});
$('readerPlay').addEventListener('click',function(){if(current)speak((current.pages||[current.text])[page])});
$('readerStop').addEventListener('click',function(){if(window.speechSynthesis)window.speechSynthesis.cancel()});
$('readerSlower').addEventListener('click',function(){rate=Math.max(.65,rate-.1)});
$('readerFaster').addEventListener('click',function(){rate=Math.min(1.2,rate+.1)});
$('readerFavorite').addEventListener('click',function(){if(!current)return;var a=favs(),i=a.indexOf(current.id);if(i>=0)a.splice(i,1);else a.push(current.id);save(a);draw()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('storyReader').classList.contains('open'))close();if($('storyReader').classList.contains('open')&&e.key==='ArrowRight')$('readerNext').click();if($('storyReader').classList.contains('open')&&e.key==='ArrowLeft')$('readerPrev').click()});
renderFilters();render();
if(stories.length!==30) $('storyCount').textContent='พบข้อมูลนิทาน '+stories.length+' เรื่อง (ควรมี 30 เรื่อง)';
})();
</script></body></html>
