<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c4ebf2"><title>KIDSWISE | นิทานภาพสำหรับเด็ก</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/app.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.story-wrap{max-width:540px;margin:auto;padding:10px 12px 110px}.story-top{display:flex;align-items:center;gap:10px;margin:6px 2px 14px}.story-back{border:0;border-radius:14px;width:42px;height:42px;background:#fff;box-shadow:0 4px 0 #d3e9df;font-size:22px;color:#146d56}.story-top h1{font:600 22px Mitr,sans-serif;color:#116b56;margin:0}.story-hero{border:3px solid #fff;border-radius:25px;padding:16px;background:linear-gradient(145deg,#d7fff0,#fff0c8);box-shadow:0 7px 0 #bce4d2,0 12px 22px #578c7020;margin-bottom:14px}.story-hero h2{font:600 23px Mitr,sans-serif;color:#08785e;margin:0 0 5px}.story-hero p{font-size:13px;line-height:1.6;color:#526c62;margin:0}.story-filter-row{display:flex;gap:7px;overflow-x:auto;padding:5px 2px 12px}.story-filter{white-space:nowrap;border:2px solid #fff;border-radius:18px;padding:8px 13px;background:linear-gradient(#fff,#edf8f2);box-shadow:0 3px 0 #d8e9e1;font:13px Prompt,sans-serif;color:#35534a}.story-filter.active{background:linear-gradient(#78d77a,#2da85b);color:#fff}.story-search{width:100%;box-sizing:border-box;border:2px solid #d7ebe2;border-radius:16px;padding:12px 14px;font:15px Prompt,sans-serif;background:#fff;margin:0 0 12px}.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.story-card{border:2px solid #fff;border-radius:22px;padding:10px;background:linear-gradient(150deg,#fff,#effbf6);box-shadow:0 6px 0 #d4ebdf,0 10px 16px #548f7020;display:flex;flex-direction:column;gap:6px;min-width:0}.story-thumb{width:100%;height:118px;object-fit:cover;border-radius:16px;box-shadow:0 4px 0 #c7e6d4;animation:floaty 4s ease-in-out infinite}.story-card h3{font:600 15px/1.35 Mitr,sans-serif;color:#214d3e;margin:2px 0}.story-meta{font-size:11px;color:#647d73}.story-desc{font-size:12px;line-height:1.55;color:#53675f;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.story-card button{border:0;border-radius:13px;padding:9px;color:#fff;background:linear-gradient(#ffb24a,#f47a12);box-shadow:0 4px 0 #d96a10;font:500 14px Prompt,sans-serif;margin-top:auto}.story-reader{position:fixed;inset:0;z-index:200;background:linear-gradient(180deg,#d2f5f0,#f9fff8);display:none;overflow-y:auto}.story-reader.open{display:block}.reader-inner{max-width:540px;margin:auto;padding:10px 14px 30px;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column}.reader-head{display:flex;align-items:center;gap:10px;padding:5px 0 10px}.reader-head button{border:0;border-radius:13px;background:#fff;width:42px;height:42px;font-size:22px;color:#166c56;box-shadow:0 4px 0 #d4e9df}.reader-head strong{font:500 15px Prompt,sans-serif;color:#32675a;flex:1}.reader-progress{height:8px;background:#e4f0e9;border-radius:20px;overflow:hidden;margin-bottom:12px}.reader-progress span{display:block;height:100%;background:linear-gradient(90deg,#30c49c,#ffb443);border-radius:20px;transition:width .25s}.reader-book{border:3px solid #fff;border-radius:27px;background:linear-gradient(155deg,#fff,#f2fff8);box-shadow:0 8px 0 #c5e7d6,0 14px 28px #52876a20;padding:12px;flex:1;display:flex;flex-direction:column}.reader-art-wrap{position:relative;overflow:hidden;border-radius:20px;background:#e6f8e8}.reader-art{width:100%;height:clamp(210px,38vh,330px);object-fit:cover;display:block;animation:floaty 5s ease-in-out infinite}.reader-spark{position:absolute;right:12px;top:8px;font-size:25px;animation:spark 2s ease-in-out infinite}.reader-page-label{font-size:11px;color:#739084;margin:14px 3px 3px}.reader-title{font:600 22px/1.4 Mitr,sans-serif;color:#08785e;margin:0 3px 8px}.reader-text{font:17px/2 Prompt,sans-serif;color:#314e43;margin:0 3px 12px;white-space:pre-line}.reader-lesson{background:linear-gradient(120deg,#fff0c9,#fff9e9);border-radius:17px;padding:12px;font:14px/1.7 Prompt,sans-serif;color:#77521b;margin-top:auto}.reader-controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-top:14px}.reader-controls button{border:0;border-radius:15px;min-height:46px;font:500 14px Prompt,sans-serif}.reader-prev,.reader-next{background:#fff;color:#176a55;box-shadow:0 4px 0 #cce5d8}.reader-play{background:linear-gradient(#ffb64c,#f47b13);color:#fff;box-shadow:0 4px 0 #d5660b}.reader-extra{display:flex;justify-content:center;gap:8px;margin-top:9px}.reader-extra button{border:0;border-radius:13px;background:#fff;padding:8px 13px;color:#3b685a;font:13px Prompt,sans-serif;box-shadow:0 3px 0 #dcebe3}.reader-voice{display:flex;flex-direction:column;gap:6px;margin:11px 2px 0;color:#547568;font:12px Prompt,sans-serif}.reader-voice select{width:100%;border:2px solid #fff;border-radius:14px;padding:10px 12px;background:#fff;color:#245748;font:13px Prompt,sans-serif;box-shadow:0 3px 0 #dcebe3}.reader-voice small{font-size:11px;line-height:1.5;color:#789087}.story-empty{text-align:center;padding:25px;color:#6b8178;grid-column:1/-1}@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes spark{0%,100%{transform:scale(.9) rotate(-8deg)}50%{transform:scale(1.15) rotate(8deg)}}
@media(max-width:360px){.story-grid{grid-template-columns:1fr}.story-thumb{height:150px}.reader-text{font-size:16px}}

/* Story reader mobile polish – preview branch */
.reader-inner{padding:10px 14px max(28px,env(safe-area-inset-bottom));}
.reader-book{padding:10px;gap:7px;min-height:0;}
.reader-art-wrap{border-radius:21px;box-shadow:0 5px 14px #3f82631c;flex:0 0 auto;}
.reader-art{height:clamp(175px,29vh,245px);aspect-ratio:4/3;object-fit:cover;object-position:center;animation:none;}
.reader-page-label{display:inline-flex;align-self:flex-start;background:#eaf8f1;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:#28745c;margin:6px 3px 0;}
.reader-title{font-size:21px;line-height:1.35;margin:0 3px 3px;}
.reader-text{font-size:16px;line-height:1.8;margin:0 3px 10px;letter-spacing:.05px;}
.reader-lesson{margin-top:auto;padding:11px 12px;}
.reader-controls{margin-top:12px;gap:7px;}
.reader-controls button{min-height:44px;font-size:13px;}
.reader-extra{margin-top:8px;flex-wrap:wrap;}
.reader-voice{margin-top:9px;}
@media(max-width:390px){
 .reader-inner{padding-left:10px;padding-right:10px;}
 .reader-art{height:clamp(165px,27vh,210px);}
 .reader-title{font-size:19px;}
 .reader-text{font-size:15px;line-height:1.75;}
 .reader-controls button{font-size:12px;min-height:42px;}
 .reader-extra button{padding:7px 10px;font-size:12px;}
}


/* Crisp, uncropped story illustrations */
.reader-art{width:100%;height:auto!important;max-height:260px;aspect-ratio:3/2;object-fit:contain!important;object-position:center;background:#f4fff8;image-rendering:auto;}
.reader-art-wrap{overflow:hidden;background:#f4fff8;}
</style>
<style>
/* Give each story its own character marker while retaining the illustration artwork. */
.story-thumb-wrap{position:relative;width:100%;height:118px;overflow:hidden;border-radius:16px}
.story-thumb-wrap .story-thumb{display:block;width:100%;height:100%;object-fit:cover}
.story-card-emoji{position:absolute;right:7px;top:7px;display:grid;place-items:center;width:36px;height:36px;border:2px solid rgba(255,255,255,.95);border-radius:13px;background:rgba(255,255,255,.88);box-shadow:0 3px 9px rgba(35,83,62,.18);font-size:22px;line-height:1}
.reader-emoji{position:absolute;left:10px;top:8px;z-index:2;display:grid;place-items:center;width:42px;height:42px;border:2px solid rgba(255,255,255,.92);border-radius:15px;background:rgba(255,255,255,.84);box-shadow:0 4px 10px rgba(35,83,62,.18);font-size:27px}
@media(max-width:360px){.story-card-emoji{width:32px;height:32px;font-size:19px}.story-thumb-wrap{height:150px}}
</style>
<style>
/* Display one quadrant of the exact approved 2x2 story artwork sprite. */
.reader-art-wrap.kw-story01-sprite{
 position:relative;
 width:100%;
 height:auto;
 aspect-ratio:360 / 237;
 max-height:42vh;
 overflow:hidden;
 background:#fff3d7;
}
.reader-art-wrap.kw-story01-sprite .reader-art{
 position:absolute;
 width:200%;
 height:200%;
 max-width:none;
 max-height:none;
 object-fit:fill;
 display:block;
 animation:none;
}
.reader-art-wrap.kw-story01-sprite .reader-emoji,
.reader-art-wrap.kw-story01-sprite .reader-spark{display:none}
</style>
<style id="kw-reader-responsive-v1">
/* Reader scales to the real device viewport, with safe areas for notches. */
.story-reader.open{
  position:fixed;inset:0;width:100%;height:100vh;height:100dvh;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
}
.reader-inner{
  box-sizing:border-box;width:100%;max-width:900px;margin-inline:auto;
  padding-top:max(12px,env(safe-area-inset-top));
  padding-right:max(14px,env(safe-area-inset-right));
  padding-bottom:max(18px,env(safe-area-inset-bottom));
  padding-left:max(14px,env(safe-area-inset-left));
}
.reader-book{box-sizing:border-box;width:100%;min-width:0;}
.reader-art-wrap{width:100%;}
.reader-art-wrap.kw-story01-sprite{
  width:100%;max-height:min(48dvh,540px);aspect-ratio:360 / 237;
}
.reader-art-wrap.kw-story01-sprite .reader-art{
  width:200%;height:200%;max-width:none;max-height:none;
}
/* Portrait tablets: use more of the available width and height. */
@media (orientation:portrait) and (min-width:700px){
  .reader-inner{max-width:940px;padding-left:24px;padding-right:24px;}
  .reader-art-wrap.kw-story01-sprite{max-height:50dvh;}
  .reader-title{font-size:clamp(23px,2.6vw,30px);}
  .reader-text{font-size:clamp(18px,2vw,23px);line-height:1.85;}
  .reader-controls button{min-height:52px;font-size:16px;}
}
/* Landscape phones and tablets: large illustration beside the reading text. */
@media (orientation:landscape) and (min-width:560px){
  .story-reader.open{overflow:hidden;}
  .reader-inner{
    width:100%;max-width:1480px;height:100vh;height:100dvh;min-height:0;
    margin:0 auto;overflow:hidden;
    padding-top:max(7px,env(safe-area-inset-top));
    padding-right:max(18px,env(safe-area-inset-right));
    padding-bottom:max(7px,env(safe-area-inset-bottom));
    padding-left:max(18px,env(safe-area-inset-left));
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1fr) auto auto;
    gap:6px 14px;
  }
  .reader-head{grid-column:1 / -1;grid-row:1;margin:0;padding:0 0 2px;}
  .reader-head button{width:38px;height:38px;}
  .reader-head strong{font-size:14px;}
  .reader-progress{grid-column:1 / -1;grid-row:2;height:6px;margin:0;}
  .reader-book{
    grid-column:1 / -1;grid-row:3;min-height:0;min-width:0;overflow:hidden;
    display:grid;
    grid-template-columns:minmax(0,1.12fr) minmax(280px,.88fr);
    grid-template-rows:auto auto minmax(0,1fr) auto;
    align-content:stretch;gap:6px 18px;padding:12px;
  }
  .reader-art-wrap{
    grid-column:1;grid-row:1 / 5;
    width:100%;height:100%;min-height:0;min-width:0;
    align-self:stretch;aspect-ratio:auto;max-height:none;
  }
  .reader-art-wrap:not(.kw-story01-sprite) .reader-art{
    width:100%;height:100%;max-height:none;aspect-ratio:auto;
    object-fit:contain!important;
  }
  .reader-art-wrap.kw-story01-sprite{
    width:100%;height:auto;max-height:100%;aspect-ratio:360 / 237;
    align-self:center;overflow:hidden;
  }
  .reader-art-wrap.kw-story01-sprite .reader-art{
    position:absolute;left:0;top:0;width:200%;height:200%;
    max-width:none;max-height:none;object-fit:fill;
  }
  .reader-art-wrap.kw-story01-sprite .reader-emoji,
  .reader-art-wrap.kw-story01-sprite .reader-spark{display:none;}
  .reader-page-label{grid-column:2;grid-row:1;margin:0;align-self:start;}
  .reader-title{grid-column:2;grid-row:2;margin:0 3px;font-size:clamp(20px,2vw,29px);line-height:1.3;}
  .reader-text{
    grid-column:2;grid-row:3;min-height:0;overflow-y:auto;
    margin:0 3px 4px;font-size:clamp(15px,1.5vw,21px);line-height:1.8;
    overscroll-behavior:contain;
  }
  .reader-lesson{grid-column:2;grid-row:4;margin-top:0;max-height:24%;overflow:auto;}
  .reader-controls{grid-column:1;grid-row:4;margin:0;gap:10px;}
  .reader-controls button{min-height:42px;font-size:14px;}
  .reader-extra{
    grid-column:2;grid-row:4;margin:0;align-self:center;
    justify-content:flex-start;gap:8px;flex-wrap:nowrap;
  }
  .reader-extra button{padding:7px 12px;font-size:12px;}
  .reader-voice{
    grid-column:1 / -1;grid-row:5;margin:0;min-width:0;
    display:grid;grid-template-columns:auto minmax(0,1fr);
    align-items:center;gap:4px 10px;font-size:11px;
  }
  .reader-voice select{min-width:0;width:100%;padding:6px 9px;font-size:12px;}
  .reader-voice small{display:none;}
}
/* Very short landscape screens: compact controls, preserve a usable picture. */
@media (orientation:landscape) and (min-width:560px) and (max-height:480px){
  .reader-inner{gap:4px 10px;padding-top:4px;padding-bottom:4px;}
  .reader-head button{width:32px;height:32px;}
  .reader-book{padding:8px;gap:4px 12px;}
  .reader-controls button{min-height:36px;font-size:12px;}
  .reader-extra button{padding:5px 8px;font-size:11px;}
  .reader-voice{font-size:10px;}
  .reader-voice select{padding:4px 7px;font-size:11px;}
}
</style>
<style id="kw-reader-story02-sprite-v1">
/* Story 2 uses a square 2x2 3D storyboard; crop one quadrant at a time. */
.reader-art-wrap.kw-story02-sprite{
  position:relative;width:100%;height:auto;aspect-ratio:1 / 1;
  max-height:min(48dvh,540px);overflow:hidden;background:#eaf8ff;
}
.reader-art-wrap.kw-story02-sprite .reader-art{
  position:absolute;left:0;top:0;width:200%;height:200%;
  max-width:none;max-height:none;object-fit:fill;object-position:left top;
  display:block;animation:none;
}
@media (orientation:landscape) and (min-width:560px){
  .reader-art-wrap.kw-story02-sprite{
    width:100%;height:auto;max-height:100%;aspect-ratio:1 / 1;
    align-self:center;overflow:hidden;
  }
}
</style>
</head><body><main class="phone kw-page"><div class="kw-status"></div><div class="story-wrap"><header class="story-top"><button class="story-back" onclick="location.href='index.html'" aria-label="กลับหน้าหลัก">‹</button><div><h1>นิทานภาพแสนสนุก</h1><div class="story-meta">อ่านทีละหน้า • ฟังเสียงเล่า • เรียนรู้ไปด้วยกัน</div></div></header><section class="story-hero"><div style="font-size:32px">📚🌈✨</div><h2>โลกนิทานแสนสนุก</h2><p>นิทานเป็นเรื่อง ๆ มีภาพการ์ตูนประกอบ ตัวหนังสืออ่านง่าย และเสียงเล่านิทานภาษาไทย</p></section><input id="storySearch" class="story-search" type="search" placeholder="🔎 ค้นหาชื่อนิทานหรือหมวดหมู่"><div id="storyFilters" class="story-filter-row"></div><div id="storyCount" class="story-meta" style="margin:0 4px 9px"></div><section id="storyGrid" class="story-grid"><p style="grid-column:1/-1;text-align:center;padding:20px;color:#58766a">กำลังเปิดนิทานทั้ง 30 เรื่อง…</p></section></div><nav id="kw-nav" class="kw-nav kw-nav-sticky" aria-label="เมนูด้านล่าง"></nav></main>

le":"ลูกเป็ดตามหาแม่","age":"0–2 ปี","category":"ครอบครัว","emoji":"🦆","text":"ลูกเป็ดเดินตามเสียงแม่ “ก้าบ ก้าบ” เมื่อเห็นแม่ก็รีบเดินเข้าไปซบปีก แม่กอดลูกเป็ดไว้แน่น","lesson":"เมื่อไม่แน่ใจ ให้มองหาผู้ใหญ่ที่ไว้ใจได้","activity":"ชี้ภาพแม่เป็ดกับลูกเป็ดและเรียกชื่อ","pages":["ริมบึงที่มีดอกบัวบาน ลูกเป็ดตัวเหลืองชื่อปุ๊กลุกเดินเล่นอยู่ใกล้แม่ มันชอบดูเงาตัวเองบนผิวน้ำและฟังเสียงนกที่ร้องอยู่บนต้นไม้","ขณะมองผีเสื้อบินผ่าน ปุ๊กลุกเดินตามไปทีละนิดจนมองไม่เห็นแม่ เมื่อหันกลับมา รอบตัวมีแต่ต้นหญ้าและดอกไม้ ลูกเป็ดเริ่มกังวลและร้อง “ก้าบ ๆ แม่อยู่ไหน”","แม่เป็ดได้ยินเสียงลูกจึงร้องตอบจากริมบึง ปุ๊กลุกหยุดเดินและตั้งใจฟัง มันไม่วิ่งไปไกล แต่ยืนรอในที่ปลอดภัยพร้อมร้องเรียกอีกครั้ง ไม่นานแม่เป็ดก็เดินมาหา","แม่กางปีกโอบลูกไว้ ปุ๊กลุกซบอกแม่อย่างโล่งใจ แม่บอกว่า “ถ้าหนูมองไม่เห็นแม่ ให้หยุดอยู่กับที่และเรียกแม่หรือผู้ใหญ่ที่ไว้ใจได้นะ” ลูกเป็ดพยักหน้า แล้วเดินกลับบ้านเคียงข้างแม่"],"art":"duck-family.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-04","title":"บอลสีแดงของหมีน้อย","age":"0–2 ปี","category":"การเรียนรู้","emoji":"🐻","text":"หมีน้อยกลิ้งบอลสีแดงไปข้างหน้า บอลกลิ้งช้า ๆ แล้วหยุดใกล้ต้นไม้ หมีน้อยเดินไปหยิบและกลิ้งอีกครั้ง","lesson":"การเล่นช่วยให้เราเรียนรู้","activity":"ชวนเด็กกลิ้งลูกบอลนุ่ม ๆ ไปมา","pages":["หมีน้อยชื่อบ๊อบบี้มีลูกบอลสีแดงสดใสเป็นของเล่นชิ้นโปรด ทุกเช้ามันจะนำบอลออกไปเล่นที่สนามหญ้าหน้าบ้าน","วันนี้บ๊อบบี้ลองกลิ้งบอลแรงขึ้น บอลกลิ้งผ่านดอกไม้ ผ่านก้อนหิน แล้วไปหยุดอยู่ใกล้ต้นไม้ใหญ่ บ๊อบบี้รีบเดินตามไป แต่บอลอยู่ไกลกว่าที่คิด","บ๊อบบี้ค่อย ๆ เดินอ้อมก้อนหินและก้มเก็บบอลขึ้นมา มันลองกลิ้งอีกครั้ง คราวนี้บอลกลิ้งไปหาเพื่อนกระรอก กระรอกช่วยส่งบอลกลับมาให้ ทั้งสองจึงผลัดกันกลิ้งบอลไปมา","บ๊อบบี้หัวเราะอย่างสนุกสนาน มันได้เรียนรู้ว่าการเล่นซ้ำ ๆ ช่วยให้ฝึกการกะระยะและการเคลื่อนไหว และเมื่อเล่นกับเพื่อนก็ยิ่งสนุกขึ้น"],"art":"bear-ball.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-05","title":"พระจันทร์บอกฝันดี","age":"0–2 ปี","category":"ก่อนนอน","emoji":"🌙","text":"พระจันทร์ยิ้มอยู่บนฟ้า ดาวดวงเล็กกระพริบแสง นกน้อยหลับในรัง กระต่ายน้อยห่มผ้าแล้วหลับตา","lesson":"การพักผ่อนช่วยให้ร่างกายเติบโต","activity":"อ่านช้า ๆ ด้วยเสียงนุ่มก่อนนอน","pages":["เมื่อพระอาทิตย์ลับขอบฟ้า พระจันทร์กลมสีเงินค่อย ๆ โผล่ขึ้นบนท้องฟ้า กระต่ายน้อยเงยหน้ามองแล้วโบกมือให้","ดาวดวงเล็กเริ่มกระพริบแสง วิบวับ วิบวับ นกน้อยบินกลับรัง ส่วนลูกเป็ดเดินตามแม่ไปนอนริมบึง","พระจันทร์ส่องแสงนุ่มนวลไปทั่วสวน กระต่ายน้อยห่มผ้า วางตุ๊กตาไว้ข้างหมอน แล้วหลับตาช้า ๆ","บนท้องฟ้า พระจันทร์ยิ้มให้ทุกคน “พักผ่อนให้เต็มที่นะ พรุ่งนี้เราจะได้พบวันใหม่” สัตว์น้อยหลับฝันดีใต้แสงจันทร์"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-06","title":"ดอกทานตะวันยิ้ม","age":"0–2 ปี","category":"ธรรมชาติ","emoji":"🌻","text":"ดอกทานตะวันหันหน้าไปทางแสงแดด ผีเสื้อบินมาเยี่ยมและโบกปีกเบา ๆ ดอกไม้ไหวตามสายลม","lesson":"สังเกตสิ่งเล็ก ๆ รอบตัวได้ทุกวัน","activity":"ชวนเด็กทำมือเป็นผีเสื้อ","pages":["ในสวนเล็ก ๆ มีเมล็ดทานตะวันเมล็ดหนึ่งนอนอยู่ในดิน มันยังมองไม่เห็นแสงแดด แต่ฝันอยากเติบโต","คุณยายรดน้ำให้ทุกเช้า ดินชุ่มชื้นและอบอุ่น เมล็ดน้อยค่อย ๆ แตกเปลือก ส่งรากเล็ก ๆ ลงไปในดิน","ไม่กี่วันต่อมา ต้นอ่อนสีเขียวโผล่พ้นดิน ใบเล็กสองใบกางออก มันเอนหาแสงแดดและรับหยดฝนอย่างสดชื่น","เมื่อเวลาผ่านไป ดอกทานตะวันสีเหลืองสดก็เบ่งบาน ผีเสื้อบินมาเยี่ยม มันยิ้มรับลมและขอบคุณคนที่ช่วยดูแล"],"art":"cloud-sprout.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-07","title":"เจ้าหอยทากใจเย็น","age":"0–2 ปี","category":"อารมณ์","emoji":"🐌","text":"หอยทากค่อย ๆ คลานไปตามใบไม้ แมลงเต่าทองรีบวิ่งผ่าน แต่หอยทากไม่รีบร้อนและเดินต่อจนถึงหยดน้ำ","lesson":"แต่ละคนเรียนรู้ในจังหวะของตัวเอง","activity":"พูดคำว่า “ช้า ๆ” พร้อมทำท่ามือ","pages":["เจ้าหอยทากตัวน้อยชื่อค่อยค่อย อาศัยอยู่ใต้ใบไม้หลังฝนตก เช้านี้มันอยากไปหาดอกไม้สีชมพูที่ปลายสวน","ระหว่างทาง ลมพัดใบไม้ไหวดังฟึ่บ ค่อยค่อยตกใจและรีบหดตัวเข้าไปในเปลือก มันหยุดนิ่งเพื่อฟังเสียงรอบตัว","ค่อยค่อยหายใจเข้าเบา ๆ แล้วค่อย ๆ ผ่อนลมหายใจออก เมื่อรู้สึกสงบ มันจึงยื่นหัวออกมามองอีกครั้ง","ถึงจะเดินช้า แต่ค่อยค่อยก็ไปถึงดอกไม้ได้ มันพบหนอนน้อยที่กำลังหลบฝน ทั้งสองยิ้มให้กันและเดินต่ออย่างใจเย็น"],"art":"turtle-rainbow.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-08","title":"มือเล็กช่วยเก็บ","age":"0–2 ปี","category":"กิจวัตร","emoji":"🧸","text":"หลังเล่นเสร็จ ตุ๊กตาหมีชวนเด็กน้อยเก็บบล็อกใส่กล่องทีละชิ้น เมื่อห้องเรียบร้อย ทั้งคู่ปรบมือให้กัน","lesson":"การเก็บของเป็นเรื่องที่ฝึกได้","activity":"ชวนเด็กเก็บของเล่นหนึ่งชิ้น","pages":["น้องมะลิเล่นตัวต่อกับตุ๊กตาอย่างสนุกสนาน เมื่อถึงเวลาอาหาร ของเล่นก็วางกระจายเต็มพื้นห้อง","คุณพ่อชวนร้องเพลงเก็บของ “ชิ้นไหนอยู่บ้านไหน เอากลับไปวางให้ตรงที่” มะลิหยิบบล็อกสีแดงขึ้นมาก่อน","มะลิแยกบล็อกใส่กล่อง ตุ๊กตากลับไปนั่งบนชั้น ส่วนหนังสือนิทานวางเรียงในตะกร้า คุณพ่อช่วยเก็บชิ้นที่อยู่ไกล","พื้นห้องสะอาดอีกครั้ง มะลิมองผลงานแล้วยิ้มกว้าง เธอรู้ว่ามือเล็ก ๆ ก็ช่วยดูแลบ้านให้น่าอยู่ได้"],"art":"bear-ball.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-09","title":"เสียงอะไรเอ่ย","age":"0–2 ปี","category":"ภาษา","emoji":"🐸","text":"กบร้อง “อ๊บ อ๊บ” นกร้อง “จิ๊บ จิ๊บ” และแมวร้อง “เหมียว” เด็กน้อยฟังแล้วหัวเราะและลองทำเสียงตาม","lesson":"การฟังและเลียนเสียงช่วยฝึกภาษา","activity":"ชวนเด็กเลียนเสียงสัตว์","pages":["เช้าวันหนึ่ง กบเขียวตัวน้อยนั่งอยู่ข้างบึง แล้วได้ยินเสียง “จิ๊บ จิ๊บ” ดังมาจากบนต้นไม้","มันเงยหน้ามอง เห็นนกน้อยกำลังร้องเพลง จากนั้นมีเสียง “กรุ๊งกริ๊ง” เพราะกระดิ่งที่คอวัวเดินผ่าน","ไม่นานฝนก็หยดลงบนใบบัว “เปาะ แปะ เปาะ แปะ” กบตั้งใจฟัง แล้วลองทำเสียงเลียนแบบอย่างสนุกสนาน","กบค้นพบว่าโลกเต็มไปด้วยเสียงหลายแบบ ทั้งเสียงสัตว์ เสียงธรรมชาติ และเสียงสิ่งของ มันจึงชวนเพื่อน ๆ ฟังเสียงรอบตัวด้วยกัน"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-10","title":"กอดอุ่นของแม่","age":"0–2 ปี","category":"ความรัก","emoji":"💚","text":"เมื่อลูกน้อยรู้สึกกลัว แม่อุ้มขึ้นมากอดและพูดเบา ๆ ว่า “แม่อยู่นี่นะ” ลูกค่อย ๆ สงบและยิ้มอีกครั้ง","lesson":"ความอบอุ่นช่วยให้เด็กรู้สึกปลอดภัย","activity":"กอดเด็กเบา ๆ หากเด็กต้องการ","pages":["น้องต้นกำลังต่อหอคอยของเล่นอยู่ในห้อง ทันใดนั้นฟ้าร้อง “ครืน!” เขาสะดุ้งและมองหาคุณแม่","ฝนตกหนักขึ้น เสียงลมดังที่หน้าต่าง ต้นเดินไปหาคุณแม่และบอกว่า “หนูกลัวเสียงฟ้าร้อง”","คุณแม่กอดต้นไว้แน่น ลูบหลังเบา ๆ แล้วบอกว่า “แม่อยู่ตรงนี้ เรามาฟังฝนด้วยกันนะ” ทั้งสองนั่งอยู่ในห้องที่ปลอดภัย","เมื่อฝนเบาลง ต้นรู้สึกสบายใจขึ้น เขารู้ว่าตนเองบอกความรู้สึกได้ และอ้อมกอดของคนที่รักช่วยให้ใจอบอุ่น"],"art":"duck-family.jpg","durationLabel":"ประมาณ 3–5 นาที"},{"id":"story-11","title":"เต่าตัวน้อยไม่ยอมแพ้","age":"3–4 ปี","category":"ความพยายาม","emoji":"🐢","text":"เต่าน้อยอยากปีนเนินเขา ครั้งแรกมันลื่นลงมา เพื่อนชวนให้ลองอีกครั้ง เต่าค่อย ๆ ก้าวทีละก้าวจนถึงยอดเนิน","lesson":"ความพยายามทีละนิดช่วยให้เราทำสิ่งยากได้","activity":"ถามว่าเต่าทำอย่างไรจึงขึ้นถึงยอด","pages":["เต่าตัวน้อยชื่อเต๋าเห็นเนินเขาสีเขียวอยู่ไกล ๆ มันอยากเดินขึ้นไปดูดอกไม้บนยอดเขาให้ได้","เต๋าเริ่มเดินทีละก้าว แต่ทางบางช่วงชันมาก มันลื่นลงมานิดหนึ่งและรู้สึกท้อ เพื่อนกระต่ายจึงชวนพักแล้วลองใหม่","คราวนี้เต๋าเลือกเดินตามทางที่ไม่ชัน จับก้อนหินที่มั่นคงและพักเมื่อเหนื่อย เพื่อน ๆ คอยให้กำลังใจอยู่ข้าง ๆ","ในที่สุดเต๋าก็ขึ้นถึงยอดเนินและเห็นดอกไม้เต็มทุ่ง มันภูมิใจที่ไม่ยอมแพ้ และได้เรียนรู้ว่าความพยายามต้องมาพร้อมความระมัดระวัง"],"art":"turtle-rainbow.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-12","title":"สีรุ้งของเพื่อน","age":"3–4 ปี","category":"มิตรภาพ","emoji":"🌈","text":"เด็กสามคนวาดภาพด้วยกัน คนหนึ่งชอบสีแดง อีกคนชอบสีฟ้า และอีกคนชอบสีเหลือง เมื่อรวมภาพเข้าด้วยกันก็เกิดรุ้งสีสวย","lesson":"เพื่อนแต่ละคนมีความชอบต่างกันได้","activity":"ชวนเด็กบอกสีที่ชอบ","pages":["หลังฝนหยุด เด็ก ๆ ในหมู่บ้านเห็นรุ้งกินน้ำพาดผ่านท้องฟ้า ทุกคนอยากวาดภาพรุ้งให้สวยเหมือนของจริง","ฟ้าเลือกสีแดง มะนาวเลือกสีเหลือง และต้นกล้าเลือกสีน้ำเงิน แต่ละคนมีสีที่ชอบไม่เหมือนกัน","เมื่อพวกเขานำสีมาวางต่อกัน ภาพรุ้งจึงมีหลายสีสดใส ฟ้าชวนเพื่อนเติมเมฆ มะนาววาดดอกไม้ และต้นกล้าวาดต้นไม้","ภาพวาดเสร็จสมบูรณ์เพราะทุกคนช่วยกัน เด็ก ๆ เข้าใจว่าเพื่อนที่แตกต่างกันสามารถสร้างสิ่งสวยงามร่วมกันได้"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-13","title":"กระเป๋าของน้องฟ้า","age":"3–4 ปี","category":"ความรับผิดชอบ","emoji":"🎒","text":"น้องฟ้าเตรียมกระเป๋าไปโรงเรียน เธอใส่ขวดน้ำ สมุด และกล่องดินสอตามรายการ แล้วตรวจอีกครั้งก่อนออกจากบ้าน","lesson":"การเตรียมของช่วยให้เรารับผิดชอบตัวเอง","activity":"ชวนเด็กเลือกของ 2 อย่างใส่กระเป๋า","pages":["น้องฟ้าตื่นเช้าเพื่อไปโรงเรียน วันนี้เธออยากเตรียมกระเป๋าด้วยตัวเอง จึงนำกระเป๋าใบโปรดมาวางบนโต๊ะ","ฟ้าดูรายการที่คุณแม่เขียนไว้ มีสมุด ดินสอ ขวดน้ำ และหมวก เธอหยิบของทีละอย่างแล้วตรวจดูให้ครบ","เมื่อจัดเสร็จ ฟ้าลองเปิดกระเป๋าดูว่าปิดได้สนิทหรือไม่ คุณแม่ช่วยตรวจอีกครั้งและเตือนให้เก็บของที่ไม่จำเป็นไว้บ้าน","ฟ้าสะพายกระเป๋าอย่างภูมิใจ เธอรู้ว่าการเตรียมของล่วงหน้าช่วยให้ไปโรงเรียนได้อย่างสบายใจและไม่ลืมสิ่งสำคัญ"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-14","title":"มดน้อยกับทางกลับบ้าน","age":"3–4 ปี","category":"การแก้ปัญหา","emoji":"🐜","text":"มดน้อยเดินตามกลิ่นขนมจนไกลจากรัง เมื่อหลงทางมันหยุดอยู่กับที่และขอให้มดผู้ใหญ่ช่วยพากลับ","lesson":"เมื่อหลงทางให้หยุดและขอความช่วยเหลือจากผู้ใหญ่ที่ไว้ใจได้","activity":"ซ้อมบอกชื่อผู้ดูแลหรือผู้ปกครอง","pages":["มดน้อยชื่อจิ๋วออกไปหาอาหารกับเพื่อน ๆ ระหว่างทางมีใบไม้ใหญ่ตกลงมาขวางทางเดินเดิม","จิ๋วเดินอ้อมใบไม้แล้วพบว่าทางแยกดูคล้ายกันไปหมด มันหยุดคิดและมองหาจุดสังเกตใกล้ ๆ","จิ๋วเห็นดอกไม้สีเหลืองที่เคยเดินผ่าน จึงเดินตามกลิ่นอาหารและรอยเท้าของเพื่อนมด ไม่นานก็พบทางที่คุ้นเคย","จิ๋วกลับถึงรังอย่างปลอดภัย มันเล่าให้เพื่อนฟังว่าการหยุดสังเกตและขอความช่วยเหลือช่วยแก้ปัญหาได้"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-15","title":"คำขอโทษของเจ้าหมี","age":"3–4 ปี","category":"อารมณ์","emoji":"🐻","text":"หมีน้อยเผลอชนหอคอยบล็อกของเพื่อนจนล้ม มันเห็นเพื่อนเสียใจจึงพูดว่า “ขอโทษนะ เรามาช่วยกันสร้างใหม่ไหม”","lesson":"การขอโทษและช่วยแก้ไขทำให้ความสัมพันธ์ดีขึ้น","activity":"ชวนเด็กฝึกพูดขอโทษ","pages":["เจ้าหมีบ๊อบบี้กำลังเล่นกับเพื่อนกระรอก ทั้งสองช่วยกันต่อหอคอยไม้ให้สูงที่สุดเท่าที่จะทำได้","บ๊อบบี้เผลอเดินชนโต๊ะ หอคอยจึงล้มลงเสียงดัง กระรอกตกใจและเสียใจที่ใช้เวลาต่อนานมาก","บ๊อบบี้รู้ว่าตนเองเป็นคนทำให้หอคอยล้ม จึงพูดว่า “ขอโทษนะ เรามาช่วยกันสร้างใหม่ได้ไหม” แล้วเริ่มเก็บไม้","กระรอกยิ้มและช่วยต่อหอคอยอีกครั้ง ทั้งสองระวังมากขึ้น บ๊อบบี้เรียนรู้ว่าคำขอโทษที่จริงใจควรมาพร้อมการแก้ไขสิ่งที่ทำ"],"art":"bear-ball.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-16","title":"สวนผักของยาย","age":"3–4 ปี","category":"ธรรมชาติ","emoji":"🥕","text":"หลานช่วยยายรดน้ำผักทุกเช้า วันหนึ่งเห็นใบผักมีรู จึงบอกยายและเรียนรู้ว่ามีหนอนตัวเล็กมาแทะใบ","lesson":"การสังเกตช่วยให้เราเรียนรู้ธรรมชาติ","activity":"ชวนเด็กสังเกตใบไม้ในสวน","pages":["เช้าวันเสาร์ คุณยายพาหลาน ๆ ไปดูสวนผักหลังบ้าน มีแปลงดินเล็ก ๆ รอให้ปลูกผักหลายชนิด","ยายสอนให้หลานพรวนดินและหยอดเมล็ดผักลงในหลุมตื้น ๆ จากนั้นกลบดินเบา ๆ และรดน้ำให้พอชุ่ม","ทุกวันเด็ก ๆ ผลัดกันดูแลต้นผัก พวกเขาสังเกตเห็นใบอ่อนงอกขึ้นและค่อย ๆ โตเป็นต้นใหญ่","เมื่อผักพร้อมเก็บ ยายชวนล้างให้สะอาดแล้วนำไปทำอาหาร เด็ก ๆ ภูมิใจที่ได้กินผักจากสวนที่ตนเองช่วยดูแล"],"art":"cloud-sprout.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-17","title":"ดาวดวงที่กล้าถาม","age":"3–4 ปี","category":"การเรียนรู้","emoji":"⭐","text":"ดาวดวงเล็กสงสัยว่าทำไมท้องฟ้าจึงมืดตอนกลางคืน มันถามพระจันทร์ แล้วพระจันทร์ชวนให้เรียนรู้เรื่องกลางวันและกลางคืน","lesson":"การถามเป็นจุดเริ่มต้นของการเรียนรู้","activity":"ถามเด็กว่าเขาอยากรู้อะไรเกี่ยวกับท้องฟ้า","pages":["ดาวดวงเล็กบนท้องฟ้าชื่อประกาย สงสัยว่าทำไมบางคืนพระจันทร์กลม บางคืนกลับเห็นเพียงเสี้ยวเล็ก ๆ","ประกายเก็บคำถามไว้ในใจ แต่ก็กลัวว่าจะถามแล้วดูไม่เก่ง จนดาวพี่ใหญ่บอกว่า “การถามคือจุดเริ่มต้นของการเรียนรู้”","ประกายจึงถามนกฮูกผู้ชอบอ่านหนังสือ นกฮูกอธิบายว่ารูปร่างพระจันทร์ที่เราเห็นเปลี่ยนไปตามตำแหน่งของดวงจันทร์และแสงอาทิตย์","ประกายขอบคุณนกฮูกและจดคำตอบไว้ มันดีใจที่กล้าถาม และตั้งใจจะหาคำตอบใหม่ ๆ ด้วยความอยากรู้อยากเห็น"],"art":"turtle-rainbow.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-18","title":"แบ่งขนมให้กัน","age":"3–4 ปี","category":"น้ำใจ","emoji":"🍪","text":"พี่มีคุกกี้สามชิ้น น้องมีสองคน พี่จึงชวนแบ่งให้ทุกคนได้กินด้วยกัน ทุกคนช่วยกันนับและแบ่งอย่างยุติธรรม","lesson":"การแบ่งอย่างยุติธรรมทำให้เล่นด้วยกันสนุก","activity":"ชวนเด็กนับของเล่นหรือผลไม้","pages":["วันหยุด กระต่ายน้อยกับกระรอกชวนกันไปปิกนิกใต้ต้นไม้ ทั้งสองเตรียมผลไม้และขนมใส่กล่องมาแบ่งกัน","ก่อนกิน กระต่ายน้อยชวนเพื่อนล้างมือให้สะอาด จากนั้นจึงเปิดกล่องและนับขนมออกมาเป็นสองส่วน","กระรอกแบ่งแอปเปิลให้กระต่าย ส่วนกระต่ายแบ่งขนมปังกรอบให้กระรอก ทั้งคู่ถามกันก่อนว่าเพื่อนอยากกินอะไร","อาหารมื้อนั้นอร่อยและสนุกกว่าที่คิด ทั้งสองรู้ว่าการแบ่งปันและใส่ใจความต้องการของเพื่อนทำให้มิตรภาพอบอุ่น"],"art":"rabbit-squirrel.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-19","title":"วันที่ลมแรง","age":"3–4 ปี","category":"ความปลอดภัย","emoji":"🍃","text":"ลมพัดแรงจนหมวกของน้องปลิว คุณพ่อจับมือน้องไว้และพาเดินห่างจากกิ่งไม้ใหญ่ ทั้งคู่รอจนลมเบาลง","lesson":"เมื่ออยู่กลางแจ้งควรอยู่ใกล้ผู้ดูแลและระวังสิ่งรอบตัว","activity":"ถามเด็กว่าควรเดินกับใครเมื่อมีลมแรง","pages":["เช้าวันหนึ่ง ลมพัดแรงจนใบไม้ปลิวไปทั่วสนาม เด็ก ๆ อยากนำว่าวออกไปเล่น แต่คุณครูสังเกตว่าท้องฟ้าเริ่มมืด","คุณครูอธิบายว่าลมแรงอาจทำให้กิ่งไม้หักและสิ่งของปลิวได้ เด็ก ๆ จึงเก็บว่าวและเดินออกจากบริเวณต้นไม้ใหญ่","ทุกคนเข้าไปอยู่ในอาคารที่ปลอดภัย ปิดหน้าต่างให้เรียบร้อย และรอจนลมสงบก่อนจะออกมาอีกครั้ง","เมื่ออากาศดีขึ้น เด็ก ๆ จึงเล่นว่าวในสนามโล่งกับผู้ใหญ่ดูแล พวกเขาเรียนรู้ว่าความสนุกต้องมาพร้อมการระวังภัย"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-20","title":"ฟันสะอาดของกระต่าย","age":"3–4 ปี","category":"สุขนิสัย","emoji":"🪥","text":"กระต่ายน้อยแปรงฟันตอนเช้าและก่อนนอน โดยมีคุณแม่ช่วยดูให้ทั่วทุกซี่ เมื่อเสร็จแล้วกระต่ายยิ้มกว้าง","lesson":"แปรงฟันสม่ำเสมอช่วยดูแลฟัน","activity":"ชวนเด็กทำท่าแปรงฟันเป็นวงกลม","pages":["กระต่ายน้อยชอบกินแครอทและผลไม้ หลังอาหารเช้า แม่กระต่ายชวนมันไปแปรงฟันหน้ากระจก","แม่บีบยาสีฟันสำหรับเด็กลงบนแปรง แล้วสอนให้แปรงเบา ๆ ให้ทั่วทั้งด้านหน้า ด้านหลัง และด้านบดเคี้ยว","กระต่ายน้อยลองทำตามโดยไม่รีบ แม่ช่วยดูเวลาและเตือนให้บ้วนปากอย่างเหมาะสม ก่อนเข้านอนก็แปรงฟันอีกครั้ง","ฟันของกระต่ายน้อยสะอาดและแข็งแรง มันรู้ว่าการดูแลฟันทุกวันช่วยให้ยิ้มสดใสและควรไปตรวจฟันกับผู้ใหญ่ตามนัด"],"art":"rabbit-squirrel.jpg","durationLabel":"ประมาณ 5–7 นาที"},{"id":"story-21","title":"นักสำรวจผู้กล้าหาญ","age":"5–6 ปี","category":"ความกล้า","emoji":"🔎","text":"มีนาอยากสำรวจสวนหลังบ้าน เธอชวนคุณตาไปด้วย เตรียมหมวกและขวดน้ำ แล้วจดสิ่งที่พบลงสมุดอย่างตั้งใจ","lesson":"ความกล้าคือการลองสิ่งใหม่อย่างรอบคอบ","activity":"ให้เด็กวาดสิ่งหนึ่งที่อยากสำรวจ","pages":["น้องพีทได้รับแผนที่เส้นทางธรรมชาติจากคุณครู เขาอยากสำรวจลำธารเล็ก ๆ กับเพื่อน แต่รู้ว่าต้องเตรียมตัวให้พร้อมก่อน","พีทตรวจดูแผนที่ เตรียมน้ำดื่ม หมวก และสมุดบันทึก แล้วขออนุญาตผู้ปกครองและตกลงว่าจะเดินกับคุณครูตลอดทาง","ระหว่างสำรวจ พีทสังเกตรอยใบไม้และเสียงน้ำ เขาพบว่าทางหนึ่งลื่นจึงบอกคุณครูและเลือกเดินบนทางที่ปลอดภัยกว่า","ทีมสำรวจกลับถึงจุดนัดหมายครบทุกคน พีทจดสิ่งที่พบลงสมุดและเข้าใจว่าความกล้าหาญที่ดีต้องมาพร้อมการวางแผน"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-22","title":"กล่องคำพูดใจดี","age":"5–6 ปี","category":"มิตรภาพ","emoji":"💌","text":"ห้องเรียนมีกล่องคำพูดใจดี เด็ก ๆ เขียนข้อความชมเพื่อน เช่น “ขอบคุณที่ช่วยเก็บของ” ทุกคนยิ้มเมื่อได้อ่านข้อความ","lesson":"คำพูดดี ๆ ทำให้คนรอบข้างรู้สึกดี","activity":"ชวนเด็กพูดคำชมหนึ่งประโยค","pages":["ในห้องเรียนมีกล่องใบหนึ่งชื่อกล่องคำพูดใจดี คุณครูชวนเด็ก ๆ เขียนคำชมที่จริงใจให้เพื่อนคนละหนึ่งใบ","น้องขิมเห็นเพื่อนชื่อมินนั่งเงียบ เพราะวันนี้มินวาดภาพไม่สำเร็จ ขิมจึงคิดหาคำพูดที่ช่วยให้เพื่อนมีกำลังใจ","ขิมเขียนว่า “ฉันชอบที่เธอตั้งใจลองใหม่” แล้วหย่อนกระดาษลงในกล่อง เมื่อคุณครูอ่าน มินก็ยิ้มและอยากลองวาดอีกครั้ง","เด็ก ๆ พบว่าคำพูดใจดีไม่จำเป็นต้องยิ่งใหญ่ แค่พูดด้วยความจริงใจและไม่ล้อเลียน ก็ช่วยให้เพื่อนรู้สึกมีคุณค่าได้"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-23","title":"เจ้ากระรอกวางแผน","age":"5–6 ปี","category":"การวางแผน","emoji":"🐿️","text":"กระรอกอยากจัดงานเล็ก ๆ ให้เพื่อน มันเขียนรายการสิ่งที่ต้องเตรียม แบ่งงานกับเพื่อน และตรวจดูทีละข้อจนงานสำเร็จ","lesson":"การวางแผนช่วยให้งานสำเร็จเป็นขั้นตอน","activity":"ชวนเด็กวางแผนกิจกรรมง่าย ๆ","pages":["เจ้ากระรอกชื่อซันอยากเก็บลูกโอ๊กให้พอกินก่อนฤดูฝน มันมีเวลาไม่มากจึงเริ่มวางแผนบนใบไม้แผ่นหนึ่ง","ซันวาดรายการสิ่งที่ต้องทำ เริ่มจากเก็บลูกโอ๊กใกล้รัง แล้วจึงไปยังต้นไม้ถัดไป พร้อมกำหนดเวลาพักเพื่อไม่ให้เหนื่อยเกินไป","ระหว่างทางซันพบลูกโอ๊กหล่นอยู่หลายเม็ด แต่ไม่เก็บจนลืมแผน มันตรวจรายการและขีดเครื่องหมายเมื่อทำแต่ละงานเสร็จ","ก่อนฝนตก ซันเก็บอาหารได้ครบและยังมีแรงเล่นกับเพื่อน มันเรียนรู้ว่าการวางแผนช่วยให้ทำสิ่งสำคัญได้โดยไม่รีบร้อน"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-24","title":"สะพานของทุกคน","age":"5–6 ปี","category":"การทำงานร่วมกัน","emoji":"🌉","text":"สัตว์ในป่าต้องข้ามลำธาร จึงช่วยกันต่อสะพานจากไม้ที่ปลอดภัย ตัวหนึ่งหาไม้ อีกตัวช่วยวาง และอีกตัวตรวจความแข็งแรง","lesson":"เมื่อร่วมมือกัน ทุกคนช่วยให้งานสำเร็จได้","activity":"ถามว่าเด็กอยากช่วยงานส่วนไหน","pages":["สัตว์น้อยหลายตัวอยากข้ามลำธารไปยังทุ่งดอกไม้ แต่สะพานไม้เก่าถูกน้ำพัดออกไป ทุกตัวจึงมาช่วยกันคิด","บีเวอร์เสนอให้หาท่อนไม้ที่แข็งแรง กระต่ายช่วยมองหาก้อนหินเรียบ ส่วนกวางช่วยตรวจว่าจุดไหนน้ำไหลไม่แรง","พวกเขาวางไม้ตามคำแนะนำของบีเวอร์และให้ผู้ใหญ่ในป่าตรวจความมั่นคงก่อน ไม่มีใครรีบวิ่งข้ามสะพาน","เมื่อสะพานปลอดภัย ทุกตัวจึงเดินข้ามทีละคนพร้อมช่วยดูแลกัน พวกเขาภูมิใจที่ใช้ความคิดและความสามารถต่างกันมาร่วมมือกัน"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-25","title":"ความจริงของต้นกล้า","age":"5–6 ปี","category":"ความซื่อสัตย์","emoji":"🌱","text":"ต้นกล้าทำแก้วน้ำหกโดยไม่ตั้งใจ เขากลัวว่าจะถูกดุ แต่ตัดสินใจบอกคุณแม่และช่วยเช็ด คุณแม่ขอบคุณที่พูดความจริง","lesson":"การพูดความจริงช่วยให้เราแก้ปัญหาได้","activity":"ชวนคุยว่าถ้าทำของหกควรทำอย่างไร","pages":["ต้นกล้ากำลังระบายสีภาพต้นไม้ แต่เผลอทำสีน้ำหกลงบนโต๊ะและสมุดของเพื่อน เขาตกใจจนอยากซ่อนคราบสีไว้","เมื่อเพื่อนกลับมา ต้นกล้ารู้สึกไม่สบายใจ เขานึกถึงสิ่งที่คุณครูสอนเรื่องความซื่อสัตย์และตัดสินใจบอกความจริง","ต้นกล้าเล่าว่าเกิดอะไรขึ้นและขอโทษเพื่อน คุณครูช่วยนำผ้ามาเช็ดโต๊ะ ส่วนต้นกล้าช่วยเช็ดสมุดตามวิธีที่เหมาะสม","เพื่อนรับฟังและให้อภัย ต้นกล้าเรียนรู้ว่าการพูดความจริงอาจยากในตอนแรก แต่ช่วยให้ทุกคนแก้ปัญหาและไว้ใจกันได้"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-26","title":"วันที่อารมณ์เป็นเมฆฝน","age":"5–6 ปี","category":"อารมณ์","emoji":"🌧️","text":"พลอยโกรธเมื่อสร้างภาพไม่สำเร็จ เธอหยุดพัก หายใจช้า ๆ แล้วลองใหม่ เมื่อยังยากอยู่ก็ขอให้คุณครูช่วย","lesson":"เรารู้สึกโกรธหรือผิดหวังได้ และเรียนรู้วิธีดูแลใจตัวเองได้","activity":"ฝึกหายใจเข้าช้า ๆ และผ่อนออก","pages":["วันหนึ่งน้องพลอยต่อหอคอยบล็อกอย่างตั้งใจ แต่หอคอยล้มลงก่อนจะเสร็จ พลอยรู้สึกโกรธและอยากร้องไห้","คุณพ่อชวนพลอยตั้งชื่อความรู้สึกว่า “ตอนนี้หนูกำลังโกรธและผิดหวัง” พลอยพยักหน้าเพราะคำพูดนั้นตรงกับใจ","ทั้งสองลองหายใจเข้าช้า ๆ แล้วผ่อนออกยาว ๆ เมื่อใจสงบลง พลอยบอกว่าต้องการให้พ่อช่วยจับฐานหอคอย","หอคอยสร้างขึ้นใหม่ได้สำเร็จ พลอยรู้ว่าทุกความรู้สึกเกิดขึ้นได้ และเราสามารถพัก หายใจ และขอความช่วยเหลือเมื่อจำเป็น"],"art":"cloud-sprout.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-27","title":"ตลาดนัดตัวเลข","age":"5–6 ปี","category":"คณิตศาสตร์","emoji":"🍎","text":"น้องต้นไปตลาดกับคุณพ่อ ช่วยนับแอปเปิลห้าลูกและกล้วยสามผล จากนั้นช่วยตรวจว่าซื้อผลไม้ครบตามรายการหรือยัง","lesson":"การนับเลขฝึกได้จากชีวิตประจำวัน","activity":"ชวนเด็กนับผลไม้หรือของใช้","pages":["เช้าวันเสาร์ น้องนัทไปตลาดกับคุณแม่ แม่ให้เหรียญของเล่นสามเหรียญและชวนเขาฝึกนับผลไม้ก่อนซื้อ","ที่ร้านแรก นัทเลือกส้มสองผล เขานับ “หนึ่ง สอง” แล้วลองนับกล้วยสามผลที่วางอยู่ในตะกร้าข้าง ๆ","แม่ชวนเปรียบเทียบว่าส้มสองผลกับกล้วยสามผล อย่างไหนมีจำนวนมากกว่า นัทชี้กล้วยและอธิบายว่าเพราะมีสามผล","นัทช่วยแม่จ่ายเงินและรับถุงผลไม้กลับบ้าน เขาสนุกกับการใช้ตัวเลขในชีวิตจริงและรู้ว่าการนับช่วยให้ซื้อของได้ถูกต้อง"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-28","title":"โลกสะอาดเริ่มที่เรา","age":"5–6 ปี","category":"สิ่งแวดล้อม","emoji":"♻️","text":"หลังปิกนิก เด็ก ๆ ช่วยกันเก็บขยะ แยกขวด กระดาษ และเศษอาหาร ก่อนกลับทุกคนตรวจดูว่าพื้นที่สะอาดแล้ว","lesson":"เราช่วยดูแลสิ่งแวดล้อมได้จากเรื่องเล็ก ๆ","activity":"ชวนเด็กแยกขยะที่บ้านตามระบบของครอบครัว","pages":["น้องข้าวกับเพื่อนเดินเล่นในสวนสาธารณะ พวกเขาเห็นกระดาษและขวดพลาสติกอยู่ใกล้ม้านั่ง จึงชวนผู้ใหญ่ช่วยดูแลพื้นที่","ผู้ใหญ่เตรียมถุงมือและที่คีบให้เด็ก ๆ พร้อมอธิบายว่าไม่ควรจับขยะที่แหลมคม สกปรก หรือไม่รู้ว่าเป็นอะไรด้วยมือเปล่า","เด็ก ๆ ใช้ที่คีบเก็บเฉพาะขยะที่ปลอดภัย แล้วแยกขวดพลาสติกออกจากเศษกระดาษตามถังที่กำหนด","สวนกลับมาสะอาดน่าเดิน ทุกคนเรียนรู้ว่าการดูแลโลกเริ่มจากการทิ้งขยะให้ถูกที่และขอความช่วยเหลือเมื่อเจอสิ่งที่ไม่ปลอดภัย"],"art":"cloud-sprout.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-29","title":"ความลับของเงา","age":"5–6 ปี","category":"วิทยาศาสตร์","emoji":"🔦","text":"พีทส่องไฟฉายไปที่ตุ๊กตาแล้วเห็นเงาบนผนัง เขาขยับไฟฉายใกล้และไกล เงาก็เปลี่ยนขนาด เขาจดสิ่งที่สังเกตได้","lesson":"การทดลองและสังเกตช่วยให้เราเข้าใจสิ่งรอบตัว","activity":"ทดลองทำเงาด้วยไฟฉายโดยมีผู้ใหญ่ดูแล","pages":["คืนหนึ่งน้องอิงใช้ไฟฉายส่องผนังห้อง แล้วเห็นเงามือของตัวเองขยับตามไปด้วย เธอสงสัยว่าเงาเกิดขึ้นได้อย่างไร","คุณพ่อบอกว่าเงาเกิดเมื่อมีสิ่งของบังแสง อิงลองยกมือไว้ระหว่างไฟฉายกับผนัง แล้วสังเกตเห็นเงารูปมือชัดเจน","เมื่ออิงขยับมือเข้าใกล้ไฟฉาย เงาบนผนังก็ใหญ่ขึ้น พอขยับมือใกล้ผนัง เงากลับเล็กลง เธอลองทำซ้ำเพื่อเปรียบเทียบ","อิงจดสิ่งที่สังเกตได้ลงสมุด เธอเรียนรู้ว่าการทดลองง่าย ๆ และการตั้งคำถามช่วยให้ค้นพบคำตอบทางวิทยาศาสตร์"],"art":"turtle-rainbow.jpg","durationLabel":"ประมาณ 6–8 นาที"},{"id":"story-30","title":"คำสัญญาของเพื่อน","age":"5–6 ปี","category":"ความรับผิดชอบ","emoji":"🤝","text":"ข้าวปั้นสัญญาว่าจะคืนหนังสือให้เพื่อนในวันศุกร์ เขาจึงวางหนังสือไว้ในกระเป๋าตั้งแต่คืนก่อน และนำไปคืนตามที่พูดไว้","lesson":"การรักษาคำพูดสร้างความไว้วางใจ","activity":"ถามเด็กว่ามีเรื่องเล็ก ๆ อะไรที่อยากรับผิดชอบ","pages":["ต้นกล้ากับเพื่อนปลูกต้นถั่วไว้หน้าห้องเรียน ทั้งสองตกลงกันว่าจะผลัดกันรดน้ำทุกเช้าและดูแลไม่ให้ดินแห้ง","ต้นกล้ารับหน้าที่วันจันทร์ ส่วนเพื่อนรับหน้าที่วันอังคาร พวกเขาทำตารางเล็ก ๆ และติดไว้ข้างกระถางเพื่อไม่ให้ลืม","วันหนึ่งต้นกล้ามาสายและพลาดเวลารดน้ำ เขารีบบอกเพื่อนและคุณครู ไม่แกล้งทำเหมือนไม่มีอะไรเกิดขึ้น แล้วช่วยรดน้ำในช่วงพัก","ต้นถั่วเติบโตมีใบใหม่ ทั้งสองยินดีที่รักษาคำสัญญาและเรียนรู้ว่าเมื่อทำพลาดควรบอกความจริง รับผิดชอบ และช่วยกันแก้ไข"],"art":"friends-bridge.jpg","durationLabel":"ประมาณ 6–8 นาที"}];</script><script>
(function(){
'use strict';
var stories=window.KW_STORIES||[],age='ทั้งหมด',query='',current=null,page=0,rate=.72;
var $=function(id){return document.getElementById(id)};
var favKey='kidwise.storyFavorites';
function favs(){try{return JSON.parse(localStorage.getItem(favKey)||'[]')}catch(e){return[]}}
function save(a){try{localStorage.setItem(favKey,JSON.stringify(a))}catch(e){}}
var filters=['ทั้งหมด','0–2 ปี','3–4 ปี','5–6 ปี','รายการโปรด'];
function renderFilters(){
 var el=$('storyFilters'); if(!el)return;
 el.innerHTML=filters.map(function(x){return '<button type="button" class="story-filter '+(age===x?'active':'')+'" data-age="'+x+'">'+(x==='รายการโปรด'?'♥ ':'')+x+'</button>'}).join('');
 el.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){age=b.dataset.age;renderFilters();render()})});
}
function render(){
 var grid=$('storyGrid'); if(!grid)return;
 var f=favs(),list=stories.filter(function(s){
  var q=query.toLowerCase().trim();
  return (age==='ทั้งหมด'||age==='รายการโปรด'||s.age===age) &&
   (age!=='รายการโปรด'||f.indexOf(s.id)>=0) &&
   (!q||(s.title+' '+s.category+' '+s.text).toLowerCase().indexOf(q)>=0);
 });
 $('storyCount').textContent='แสดง '+list.length+' จาก '+stories.length+' เรื่อง';
 grid.innerHTML=list.length?list.map(function(s){
  var art=s.art||'rabbit-squirrel.jpg';
  var duration=s.durationLabel||'อ่านประมาณ 5 นาที';
  return '<article class="story-card"><div class="story-thumb-wrap"><img class="story-thumb" loading="lazy" src="'+art+'" alt="ภาพประกอบ '+s.title+'"><span class="story-card-emoji" aria-hidden="true">'+(s.emoji||'📚')+'</span></div><div class="story-meta">'+s.age+' · '+s.category+' · '+duration+'</div><h3>'+s.title+'</h3><p class="story-desc">'+((s.pages&&s.pages[0])||s.text||'')+'</p><button type="button" data-open="'+s.id+'">📖 เปิดอ่านนิทาน</button></article>';
 }).join(''):'<div class="story-empty">ยังไม่พบนิทาน ลองเปลี่ยนคำค้นหานะ</div>';
 grid.querySelectorAll('[data-open]').forEach(function(b){b.addEventListener('click',function(){open(b.dataset.open)})});
}
function voiceScore(v){
 var n=(v.name||'').toLowerCase(),s=0;
 if(/premwadee|female|woman|หญิง|kanya/.test(n))s+=20;
 if(/natural|online/.test(n))s+=8;
 if(/google/.test(n))s+=3;
 if(/niwat|piyawat|male|man|ชาย/.test(n))s-=20;
 return s;
}
function thaiVoices(){
 return window.speechSynthesis.getVoices().filter(function(v){return /^th(-|_|$)/i.test(v.lang)});
}
function refreshVoiceChoices(){
 var select=$('readerVoiceSelect');if(!select)return;
 var voices=thaiVoices(),saved='';
 try{saved=localStorage.getItem('kidwise.storyVoice')||'auto'}catch(e){}
 var html='<option value="auto">เสียงนุ่มนวลอัตโนมัติ</option>';
 voices.sort(function(a,b){return voiceScore(b)-voiceScore(a)});
 voices.forEach(function(v,i){
  var label=(v.name||'เสียงภาษาไทย')+' ('+v.lang+')';
  html+='<option value="'+String(v.voiceURI).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+label+'</option>';
 });
 select.innerHTML=html;
 select.value=voices.some(function(v){return v.voiceURI===saved})?saved:'auto';
}
function chooseThaiVoice(){
 var voices=thaiVoices(),select=$('readerVoiceSelect'),chosen=select&&select.value;
 if(chosen&&chosen!=='auto'){
  var exact=voices.find(function(v){return v.voiceURI===chosen});if(exact)return exact;
 }
 voices.sort(function(a,b){return voiceScore(b)-voiceScore(a)});
 return voices[0]||null;
}
function speak(text){
 if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){alert('อุปกรณ์นี้ไม่รองรับเสียงอ่าน');return}
 var synth=window.speechSynthesis;
 synth.cancel();
 var voices=thaiVoices();
 if(!voices.length){
  var retried=false;
  function retry(){
   if(retried)return;
   var ready=thaiVoices();
   if(!ready.length)return;
   retried=true;synth.removeEventListener('voiceschanged',retry);speak(text);
  }
  synth.addEventListener('voiceschanged',retry);
  setTimeout(function(){retry();if(!retried){synth.removeEventListener('voiceschanged',retry);alert('ยังไม่พบเสียงภาษาไทยในอุปกรณ์ กรุณาติดตั้งเสียงภาษาไทยใน Windows หรือเลือกเสียงภาษาไทยในเบราว์เซอร์');}},1800);
  return;
 }
 var u=new SpeechSynthesisUtterance(text);
 u.lang='th-TH';
 u.rate=rate;
 u.pitch=1.06;
 u.volume=0.88;
 var voice=chooseThaiVoice();if(voice)u.voice=voice;
 synth.speak(u);
}

function loadStory01Image(pageIndex, storyId){
 var image=$('readerArt');
 var wrap=image.parentNode;
 wrap.classList.add('kw-story01-sprite');
 image.style.left=(pageIndex%2 ? '-100%' : '0');
 image.style.top=(pageIndex>=2 ? '-100%' : '0');
 if(current && current.id===storyId && page===pageIndex){
  image.src='assets/story01-pages-sprite.webp?v=23';
 }
}

var story02SpritePromise=null;
function loadStory02Image(pageIndex, storyId){
 var image=$('readerArt');
 var wrap=image.parentNode;
 wrap.classList.add('kw-story01-sprite','kw-story02-sprite');
 image.style.left=(pageIndex%2 ? '-100%' : '0');
 image.style.top=(pageIndex>=2 ? '-100%' : '0');
 if(image.dataset.story02Ready==='1' || image.dataset.story02Loading==='1') return;
 image.dataset.story02Loading='1';
 if(!story02SpritePromise){
  var files=[
   'assets/story02-sprite-part-01a.txt',
   'assets/story02-sprite-part-01b.txt',
   'assets/story02-sprite-part-02.txt',
   'assets/story02-sprite-part-03.txt',
   'assets/story02-sprite-part-04.txt',
   'assets/story02-sprite-part-05.txt',
   'assets/story02-sprite-part-06.txt',
   'assets/story02-sprite-part-07.txt'
  ];
  story02SpritePromise=Promise.all(files.map(function(path){
   return fetch(path).then(function(response){
    if(!response.ok) throw new Error('Could not load '+path);
    return response.text();
   });
  })).then(function(parts){
   var base64=parts.join('');
   if(base64.length!==41772) throw new Error('Cloud story illustration data is incomplete');
   return 'data:image/webp;base64,'+base64;
  });
 }
 story02SpritePromise.then(function(src){
  if(current && current.id===storyId){
   image.src=src;
   image.dataset.story02Ready='1';
  }
  image.dataset.story02Loading='';
 }).catch(function(error){
  console.error('KIDWISE story 2 illustration:',error);
  image.dataset.story02Loading='';
  story02SpritePromise=null;
  if(current && current.id===storyId) image.src='cloud-sprout.jpg';
 });
}

function draw(){
 var pages=current.pages||[current.text],total=pages.length;
 $('readerCounter').textContent='หน้า '+(page+1)+' จาก '+total;
 $('readerProgress').style.width=((page+1)/total*100)+'%';
 var artSet=['rabbit-squirrel.jpg','cloud-sprout.jpg','duck-family.jpg','bear-ball.jpg','friends-bridge.jpg','turtle-rainbow.jpg'];
 var artStart=artSet.indexOf(current.art||'rabbit-squirrel.jpg');
 if(artStart<0)artStart=0;
 var nextArt=artSet[(artStart+page)%artSet.length];
 $('readerArt').loading='eager';
 var storyArt=(current.pageArts&&current.pageArts[page])||current.art||'rabbit-squirrel.jpg';
 if(current.id==='story-01'){
  loadStory01Image(page,current.id);
 }else if(current.id==='story-02'){
  loadStory02Image(page,current.id);
 }else{
  $('readerArt').parentNode.classList.remove('kw-story01-sprite','kw-story02-sprite');
  $('readerArt').style.cssText='';
  $('readerArt').src=storyArt+'?v=18-'+encodeURIComponent(current.id)+'-'+page;
 }
 $('readerArt').alt='ภาพการ์ตูนประกอบเรื่อง '+current.title+' หน้า '+(page+1);$('readerEmoji').textContent=current.emoji||'📖';
 $('readerPageLabel').textContent='หน้า '+(page+1)+' · '+current.age;
 $('readerTitle').textContent=current.title;$('readerText').textContent=pages[page];
 $('readerLesson').hidden=page!==total-1;
 $('readerLesson').textContent='💡 ข้อคิด: '+current.lesson+'\n\nชวนทำต่อ: '+current.activity;
 $('readerPrev').disabled=page===0;$('readerPrev').style.opacity=page===0?'.45':'1';
 $('readerNext').textContent=page===total-1?'อ่านจบแล้ว ✓':'หน้าถัดไป ›';
 $('readerFavorite').textContent=favs().includes(current.id)?'♥':'♡';
}
function open(id){current=stories.find(function(s){return s.id===id});if(!current)return;page=0;$('storyReader').classList.add('open');document.body.style.overflow='hidden';draw()}
function close(){if(window.speechSynthesis)window.speechSynthesis.cancel();$('storyReader').classList.remove('open');document.body.style.overflow=''}
$('storySearch').addEventListener('input',function(){query=this.value;render()});
$('readerClose').addEventListener('click',close);
$('readerPrev').addEventListener('click',function(){if(page>0){page--;if(window.speechSynthesis)window.speechSynthesis.cancel();draw()}});
$('readerNext').addEventListener('click',function(){if(page<(current.pages.length-1)){page++;if(window.speechSynthesis)window.speechSynthesis.cancel();draw()}else close()});
$('readerPlay').addEventListener('click',function(){if(current)speak((current.pages||[current.text])[page])});
$('readerStop').addEventListener('click',function(){if(window.speechSynthesis)window.speechSynthesis.cancel()});
window.speechSynthesis&&window.speechSynthesis.addEventListener('voiceschanged',refreshVoiceChoices);refreshVoiceChoices();$('readerVoiceSelect').addEventListener('change',function(){try{localStorage.setItem('kidwise.storyVoice',this.value)}catch(e){}});$('readerSlower').addEventListener('click',function(){rate=Math.max(.55,rate-.05)});
$('readerFaster').addEventListener('click',function(){rate=Math.min(1.1,rate+.05)});
$('readerFavorite').addEventListener('click',function(){if(!current)return;var a=favs(),i=a.indexOf(current.id);if(i>=0)a.splice(i,1);else a.push(current.id);save(a);draw()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('storyReader').classList.contains('open'))close();if($('storyReader').classList.contains('open')&&e.key==='ArrowRight')$('readerNext').click();if($('storyReader').classList.contains('open')&&e.key==='ArrowLeft')$('readerPrev').click()});
renderFilters();render();
if(stories.length!==30) $('storyCount').textContent='พบข้อมูลนิทาน '+stories.length+' เรื่อง (ควรมี 30 เรื่อง)';
})();
</script></body></html>
