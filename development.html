<style>
body{margin:0}
a{color:#2f9a3f}a:hover{color:#1f7a2e}
.kw-card{background:linear-gradient(180deg,rgba(255,255,255,.96) 0%,rgba(243,250,248,.92) 100%);border:2px solid rgba(255,255,255,.95);box-shadow:inset 0 3px 0 #fff,inset 0 -4px 0 rgba(150,205,195,.3),0 12px 26px rgba(70,150,150,.2)}
.kw-seg{flex:1;height:48px;border:none;border-radius:24px;background:transparent;font-family:'Mitr',sans-serif;font-weight:500;font-size:19px;color:#2c3b37;cursor:pointer}
.kw-seg-on{background:linear-gradient(180deg,#6fd166,#2fa13d);color:#fff;font-weight:600;box-shadow:inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 #22852f,0 6px 12px rgba(40,140,50,.3)}
.kw-box{width:30px;height:30px;flex:none;border:none;padding:0;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.kw-box-on{background:linear-gradient(180deg,#6fd166,#2fa13d);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 #22852f}
.kw-box-off{background:#fff;box-shadow:inset 0 0 0 2px #c9d3d1,inset 0 -2px 0 #e3eae9}
.kw-rec{display:flex;flex-direction:column;align-items:center;box-sizing:border-box;height:206px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#fffdf3,#fff4d8);border:3px solid rgba(255,255,255,.95);box-shadow:inset 0 -5px 0 rgba(230,200,120,.3),0 10px 18px rgba(150,130,60,.2);text-decoration:none;color:#2c2c2c}
.kw-rec img{width:100%;height:136px;object-fit:cover}
.kw-rec span{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Mitr',sans-serif;font-weight:500;font-size:17px;line-height:1.2;padding:0 4px}
.kw-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:86px;border-radius:22px;text-decoration:none;color:#3a4a46;font-family:'Prompt',sans-serif;font-size:13px}
.kw-tab img{width:40px;height:40px;object-fit:contain}
.kw-tab-on{background:linear-gradient(180deg,#6fd166 0%,#36a843 100%);color:#fff;font-weight:600;box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 #24852f,0 8px 14px rgba(40,140,50,.35)}
</style>

<style>
/* Responsive development page: replace the old fixed canvas with document flow. */
body[data-page="development"]{padding:18px 12px 24px;background:#edf6f2;align-items:flex-start}
body[data-page="development"] .phone{width:min(560px,100%);max-width:560px;box-shadow:none;border-radius:28px}
.kw-dev-shell{position:relative;width:100%!important;max-width:560px;height:auto!important;min-height:100svh;box-sizing:border-box;overflow:visible!important;border-radius:28px!important;padding:14px 14px 18px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#c4ebf2 0%,#d6f2ee 25%,#e6f7ee 60%,#d9f1d4 85%,#c4e8b4 100%);font-family:'Prompt',sans-serif;color:#2c3b37}
.kw-dev-shell>div[aria-hidden="true"]{display:none!important}
.kw-dev-shell>div,.kw-dev-shell>label,.kw-dev-shell>section,.kw-dev-shell>nav{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;width:100%!important;height:auto!important;box-sizing:border-box;margin:0!important}
.kw-dev-shell>div:first-child{display:flex!important;align-items:center;gap:12px;padding:10px 2px 0;z-index:2}
.kw-dev-shell>div:first-child h1{font-size:clamp(20px,4vw,27px)!important;line-height:1.2}
.kw-dev-shell>label{display:block;padding:0 4px;z-index:2}
.kw-dev-shell>label select{height:56px!important;font-size:clamp(19px,4vw,24px)!important}
.kw-dev-shell>#tabs{display:flex!important;flex-wrap:wrap;min-height:60px;padding:6px!important;gap:4px!important;border-radius:22px!important;z-index:2}
.kw-dev-shell>#tabs button{min-width:calc(50% - 4px);height:42px!important;font-size:clamp(14px,3.2vw,17px)!important}
.kw-dev-shell>section.kw-card{display:flex!important;align-items:center;min-height:220px;padding:14px!important;gap:12px!important;border-radius:24px!important;z-index:2}
.kw-dev-shell>section.kw-card>img{width:clamp(78px,25%,138px)!important;height:auto!important;max-height:180px;object-fit:contain;flex:none;margin:0!important}
.kw-dev-shell>section.kw-card>div{min-width:0;flex:1}
.kw-dev-shell>section.kw-card h2{font-size:clamp(16px,3.5vw,20px)!important}
.kw-dev-shell>section.kw-card #items{gap:7px!important}
.kw-dev-shell>div:nth-of-type(5){display:flex!important;align-items:center;gap:8px;padding:2px 4px 0}
.kw-dev-shell>div:nth-of-type(5) h2{font-size:clamp(22px,4.4vw,26px)!important}
.kw-dev-shell>#recs{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px!important;padding:0 2px;z-index:2}
.kw-dev-shell .kw-rec{height:190px}
.kw-dev-shell .kw-rec img{height:120px}
.kw-dev-shell .kw-rec span{font-size:clamp(13px,2.8vw,16px)}
.kw-dev-shell>section:not(.kw-card){display:flex!important;align-items:center;gap:10px;padding:14px!important;border-radius:22px!important;z-index:2}
.kw-dev-shell>section:not(.kw-card)>img{width:48px!important;height:52px!important;flex:none}
.kw-dev-shell>section:not(.kw-card) h2{font-size:clamp(17px,3.8vw,21px)!important}
.kw-dev-shell>section:not(.kw-card) p{font-size:clamp(14px,3vw,17px)!important}
.kw-dev-shell>.kw-nav-abs{position:sticky!important;bottom:0!important;width:100%!important;height:84px!important;margin-top:0!important;border-radius:22px!important}
@media(max-width:430px){
 body[data-page="development"]{padding:0;background:#c4ebf2}
 body[data-page="development"] .phone{width:100%;max-width:100%;border-radius:0}
 .kw-dev-shell{border-radius:0!important;padding:12px 12px 18px;gap:12px}
 .kw-dev-shell>#recs{grid-template-columns:repeat(2,minmax(0,1fr))}
 .kw-dev-shell .kw-rec{height:166px}
 .kw-dev-shell .kw-rec img{height:100px}
}
@media(max-width:355px){
 .kw-dev-shell>section.kw-card{align-items:flex-start}
 .kw-dev-shell>section.kw-card>img{width:70px!important}
 .kw-dev-shell>#tabs button{min-width:100%;height:38px!important}
 .kw-dev-shell>.kw-nav-abs{gap:0}
}
</style>
