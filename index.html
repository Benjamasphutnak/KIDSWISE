a{color:#2f9a3f}a:hover{color:#1f7a2e}

.kw-tab-on{background:linear-gradient(180deg,#6fd166 0%,#36a843 100%);color:#fff;font-weight:600;box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 #24852f,0 8px 14px rgba(40,140,50,.35)}

.kw-check-off{background:#fff;box-shadow:inset 0 0 0 2.5px #c9d3d1,inset 0 -3px 0 #e3eae9,0 2px 4px rgba(0,0,0,.06)}
.kw-check-on{background:linear-gradient(180deg,#6fd166,#2fa13d);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 0 #22852f,0 4px 8px rgba(40,140,50,.3)}
