 <linearGradient id="shirt" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b9e8ff"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="3"/></filter>
