  <path d="M14 -29 Q32 -43 38 -28 Q31 -17 17 -20Z" fill="#ff4e9a" stroke="#fff" stroke-width="2"/>
  <ellipse cx="-9" cy="-7" rx="3.5" ry="5" fill="#2b2430"/><ellipse cx="10" cy="-7" rx="3.5" ry="5" fill="#2b2430"/>
  <path d="M-7 5 Q0 13 8 5" fill="none" stroke="#a84c48" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="-16" cy="3" r="5" fill="#f58c85" opacity=".45"/><circle cx="16" cy="3" r="5" fill="#f58c85" opacity=".45"/>
 </g>
