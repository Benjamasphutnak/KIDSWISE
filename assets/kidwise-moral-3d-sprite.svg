<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#75d9ff"/><stop offset="1" stop-color="#d8f8df"/></linearGradient>
 <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#91df79"/><stop offset="1" stop-color="#3da85c"/></linearGradient>
 <radialGradient id="skin"><stop stop-color="#ffe4bd"/><stop offset="1" stop-color="#e9a56e"/></radialGradient>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#56c7ff"/><stop offset="1" stop-color="#1766c7"/></linearGradient>
