<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768" role="img" aria-label="ลูกเป็ดตามหาแม่ สี่ฉาก">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#cceeff"/><stop offset="1" stop-color="#fff4de"/></linearGradient>
 <linearGradient id="pond" x2="0" y2="1"><stop stop-color="#b8e9e4"/><stop offset="1" stop-color="#65bdce"/></linearGradient>
 <linearGradient id="meadow" x2="0" y2="1"><stop stop-color="#c5e9a9"/><stop offset="1" stop-color="#79bd83"/></linearGradient>
 <linearGradient id="mom" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".72" stop-color="#f6f5ef"/><stop offset="1" stop-color="#dfe8e0"/></linearGradient>
 <linearGradient id="duck" x2=".8" y2="1"><stop stop-color="#fff2a5"/><stop offset=".72" stop-color="#ffd45a"/><stop offset="1" stop-color="#edaa38"/></linearGradient>
 <linearGradient id="bill" x2="0" y2="1"><stop stop-color="#ffc05a"/><stop offset="1" stop-color="#ef7933"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff9d9"/><stop offset="1" stop-color="#ffd16d"/></radialGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="6"/><feComponentTransfer><feFuncA type="linear" slope=".19"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <symbol id="mother" viewBox="-100 -110 205 175"><g filter="url(#shadow)"><ellipse cx="0" cy="0" rx="67" ry="43" fill="url(#mom)"/><path d="M-20 -20Q8 -38 32 -12Q32 13 4 14Q-22 14 -32 -2Z" fill="#e6ece7"/><circle cx="-37" cy="-48" r="29" fill="url(#mom)"/><ellipse cx="-47" cy="-54" rx="4" ry="5" fill="#34414a"/><circle cx="-48" cy="-56" r="1.4" fill="#fff"/><path d="M-64 -43Q-82 -40 -87 -31Q-74 -25 -55 -35Z" fill="url(#bill)"/><path d="M-10 35l-5 15M23 35l2 15" stroke="#ed9139" stroke-width="5" stroke-linecap="round"/></g></symbol>
 <symbol id="duckling" viewBox="-65 -85 145 125"><g filter="url(#shadow)"><ellipse cx="0" cy="0" rx="43" ry="29" fill="url(#duck)"/><ellipse cx="9" cy="-4" rx="21" ry="13" fill="#fff1a4"/><circle cx="-23" cy="-33" r="23" fill="url(#duck)"/><ellipse cx="-30" cy="-39" rx="3.5" ry="4.5" fill="#34414a"/><circle cx="-31" cy="-41" r="1.3" fill="#fff"/><path d="M-43 -29Q-57 -28 -63 -20Q-51 -13 -38 -23Z" fill="url(#bill)"/><path d="M-11 24l-4 11M16 24l2 11" stroke="#ed9139" stroke-width="4" stroke-linecap="round"/></g></symbol>
 <g id="lily"><path d="M0 0Q-20 -18 0 -27Q8 -43 15 -15Q34 -17 10 5Z" fill="#f4a6c0" stroke="#df83a8"/><circle cx="5" cy="-8" r="4" fill="#ffcf66"/></g>
 <g id="butterfly"><path d="M0 0Q-30 -37 -25 -7Q-39 21 -3 12Q9 29 20 5Q43 -15 20 -27Q7 -30 0 0Z" fill="#bea3ed" stroke="#9077ca" stroke-width="2"/><path d="M0 0v18" stroke="#62517c" stroke-width="3"/></g>
</defs>
<!-- PAGE 1: by the pond with mother -->
<g transform="translate(0 0)"><rect width="384" height="384" fill="url(#sky)"/><circle cx="310" cy="60" r="31" fill="url(#sun)"/><path d="M0 210Q90 175 175 211T384 204V384H0Z" fill="url(#meadow)"/><path d="M0 253Q100 226 190 255T384 245V384H0Z" fill="url(#pond)"/><path d="M15 290Q100 270 190 291T365 281" fill="none" stroke="#e4fff8" stroke-width="4"/><use href="#lily" x="56" y="270"/><use href="#lily" x="321" y="264"/><g transform="translate(72 153) scale(.88)"><use href="#mother" width="205" height="175"/></g><g transform="translate(205 202) scale(.74)"><use href="#duckling" width="145" height="125"/></g><path d="M28 335q10 -28 20 0M348 342q9 -29 17 0" stroke="#59a775" stroke-width="5" fill="none" stroke-linecap="round"/></g>
<!-- PAGE 2: follows butterfly and becomes separated -->
<g transform="translate(384 0)"><rect width="384" height="384" fill="url(#sky)"/><circle cx="65" cy="64" r="26" fill="url(#sun)"/><path d="M0 194Q95 151 180 190T384 179V384H0Z" fill="#b9dfa7"/><path d="M0 251Q100 219 192 253T384 237V384H0Z" fill="url(#meadow)"/><path d="M98 384Q144 315 207 290T290 234" stroke="#f3ddb8" stroke-width="36" fill="none" stroke-linecap="round"/><path d="M98 384Q144 315 207 290T290 234" stroke="#fff8e7" stroke-width="3" stroke-dasharray="6 11" fill="none"/><g transform="translate(279 177) scale(.85)"><use href="#butterfly"/></g><g transform="translate(77 205) scale(.9)"><use href="#duckling" width="145" height="125"/></g><g fill="#f6a9bf"><circle cx="38" cy="317" r="7"/><circle cx="350" cy="330" r="7"/></g><g fill="#fff"><circle cx="38" cy="317" r="3"/><circle cx="350" cy="330" r="3"/></g></g>
<!-- PAGE 3: waits in a safe place while mother approaches -->
<g transform="translate(0 384)"><rect width="384" height="384" fill="url(#sky)"/><circle cx="318" cy="63" r="29" fill="url(#sun)"/><path d="M0 209Q89 172 174 207T384 195V384H0Z" fill="url(#meadow)"/><path d="M0 256Q95 230 183 259T384 244V384H0Z" fill="url(#pond)"/><path d="M0 281Q96 261 180 283T384 270" stroke="#e4fff8" stroke-width="4" fill="none"/><path d="M20 246q22 -45 44 0M43 247q28 -35 54 0" stroke="#5da56d" stroke-width="7" fill="none" stroke-linecap="round"/><g transform="translate(67 226) scale(.7)"><use href="#duckling" width="145" height="125"/></g><g transform="translate(203 166) scale(.79)"><use href="#mother" width="205" height="175"/></g><path d="M157 273Q192 245 223 250" stroke="#fff5d7" stroke-width="4" stroke-dasharray="5 8" fill="none"/><use href="#lily" x="48" y="312"/><use href="#lily" x="329" y="303"/></g>
<!-- PAGE 4: reunion and reassuring hug -->
<g transform="translate(384 384)"><rect width="384" height="384" fill="url(#sky)"/><circle cx="310" cy="64" r="32" fill="url(#sun)"/><path d="M0 205Q94 166 180 205T384 190V384H0Z" fill="url(#meadow)"/><path d="M0 253Q100 226 185 258T384 242V384H0Z" fill="url(#pond)"/><ellipse cx="190" cy="325" rx="106" ry="14" fill="#338fa4" opacity=".2"/><g transform="translate(76 157) scale(1.03)"><use href="#mother" width="205" height="175"/><path d="M-6 -14Q20 -38 40 -17Q45 1 22 15Q7 20 -3 7Z" fill="#e3eae4"/></g><g transform="translate(183 220) scale(.64)"><use href="#duckling" width="145" height="125"/></g><path d="M120 269q17 -25 32 0M270 240q15 -23 29 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><use href="#lily" x="54" y="309"/><use href="#lily" x="322" y="300"/></g>
</svg>