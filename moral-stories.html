let storyIndex=0,sceneIndex=0,playing=false;
const $=id=>document.getElementById(id);
function buildCards(){$("episodes").innerHTML=stories.map((s,i)=>'<button class="episode" data-story="'+i+'"><div class="art">'+s.cover+'</div><b>ตอนที่ '+(i+1)+' · '+s.title+'</b><small>'+s.sub+'</small></button>').join("");document.querySelectorAll("[data-story]").forEach(b=>b.addEventListener("click",()=>openStory(Number(b.dataset.story))))}
function render(){const s=stories[storyIndex],v=s.scenes[sceneIndex];$("emoji").textContent=v[0];$("sceneTitle").textContent=v[1];const sceneAssets=["moral-3d-honesty.svg","moral-3d-sharing.svg","moral-3d-promise.svg","moral-3d-friendship.svg"];const art=$("sceneArt");art.style.backgroundImage="url(assets/"+sceneAssets[storyIndex]+")";art.style.backgroundSize="cover";art.style.backgroundPosition="center";$("dialogue").textContent=v[2];$("counter").textContent="ตอนที่ "+(storyIndex+1)+" · ฉากที่ "+(sceneIndex+1)+" / 6";$("progress").style.width=((sceneIndex+1)/6*100)+"%";$("lesson").innerHTML="<b>💡 ข้อคิดท้ายเรื่อง</b><br>"+s.lesson;$("prev").disabled=sceneIndex===0;$("next").disabled=sceneIndex===5;$("play").textContent=playing?"กำลังอ่านเสียง…":"▶ อ่านพร้อมเสียง"}
function openStory(i){stop();storyIndex=i;sceneIndex=0;$("viewer").classList.add("show");$("episodes").style.display="none";render();$("viewer").scrollIntoView({behavior:"smooth",block:"start"})}
function stop(){playing=false;if("speechSynthesis"in window)speechSynthesis.cancel();if($("viewer").classList.contains("show"))render()}
function speak(){if(!("speechSynthesis"in window)){alert("อุปกรณ์นี้ยังไม่รองรับเสียงอ่าน");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(stories[storyIndex].scenes[sceneIndex][2]);u.lang="th-TH";u.rate=.9;u.pitch=1.08;u.onend=()=>{if(!playing)return;if(sceneIndex<5){sceneIndex++;render();speak()}else{playing=false;render()}};speechSynthesis.speak(u)}
$("play").onclick=()=>{playing=true;render();speak()};$("stop").onclick=stop;$("next").onclick=()=>{stop();sceneIndex=Math.min(5,sceneIndex+1);render()};$("prev").onclick=()=>{stop();sceneIndex=Math.max(0,sceneIndex-1);render()};$("close").onclick=()=>{stop();$("viewer").classList.remove("show");$("episodes").style.display="grid";$("episodes").scrollIntoView({behavior:"smooth"})};buildCards();
</script></body></html>
