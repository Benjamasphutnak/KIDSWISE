<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a7e8d0"><title>การ์ตูนสอนใจ | KIDWISE</title><link rel="stylesheet" href="css/app.css"><link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#b8f0e2,#fff2c9);font-family:Prompt,Tahoma,sans-serif;color:#285646}.wrap{max-width:850px;margin:auto;padding:16px}.back{color:#28795d;text-decoration:none;font-weight:600}.hero{margin:14px 0;background:#fff;border:4px solid white;border-radius:25px;overflow:hidden;box-shadow:0 7px 0 #8bc8a7}.hero img{display:block;width:100%;height:auto}.hero h1{margin:12px 16px 2px;font:700 26px Mitr}.hero p{margin:0 16px 14px;color:#58806d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.episode{border:3px solid white;border-radius:23px;padding:13px;background:linear-gradient(145deg,#fff,#e9fff4);box-shadow:0 6px 0 #b8dec6;cursor:pointer;text-align:left;color:inherit;font:inherit}.episode .art{height:105px;border-radius:16px;display:grid;place-items:center;font-size:54px;background:linear-gradient(145deg,#c9f4e1,#fff0b9);margin-bottom:9px}.episode b{display:block;font:600 18px Mitr}.episode small{color:#628171}.viewer{display:none;margin-top:15px;background:white;border:4px solid white;border-radius:25px;padding:12px;box-shadow:0 7px 0 #8bc8a7}.viewer.show{display:block}.scene{min-height:190px;border-radius:18px;background:linear-gradient(145deg,#d6f7eb,#fff0c6);display:grid;place-items:center;text-align:center;padding:16px}.scene .emoji{font-size:75px}.scene h2{font:600 21px Mitr;margin:5px}.dialogue{margin:12px 0;background:#f4fff8;border:2px solid #e5f7eb;border-radius:18px;padding:15px;text-align:center;font-size:18px;line-height:1.6;min-height:82px}.caption{text-align:center;font-weight:600;color:#39815f}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:13px 0}button{border:0;border-radius:15px;padding:11px 15px;font:600 15px Prompt;cursor:pointer;background:#eaf8ef;color:#28654e;box-shadow:0 4px 0 #c5dfce}button.primary{background:#ffbd63;color:#603d16;box-shadow:0 4px 0 #e69a43}.progress{height:8px;background:#e3f4e8;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;width:16.6%;background:#72c98f}.lesson{background:#fff8dd;border-radius:16px;padding:13px;line-height:1.6;margin-top:12px}.small{font-size:12px;color:#648372}@media(max-width:520px){.grid{gap:9px}.episode{padding:9px}.episode .art{height:88px;font-size:45px}.episode b{font-size:16px}.wrap{padding:12px}}

/* KIDWISE 3D STORY WORLD — refreshed layout */
body{margin:0;background:linear-gradient(180deg,#72d5ee 0%,#c9f1eb 55%,#fff0c8 100%);font-family:Prompt,Tahoma,sans-serif;color:#183b67}
.wrap{max-width:1500px;margin:auto;padding:18px 22px 40px;display:grid;grid-template-columns:285px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:14px;padding:15px 13px 18px;border:4px solid #fff;border-radius:30px;background:linear-gradient(180deg,#d8fff9,#8fe5df);box-shadow:0 8px 0 #4eafa9,0 14px 25px #2a718833}
.brand{padding:8px 4px 16px;text-align:center;font:700 31px Mitr;color:#f35a31;text-shadow:0 2px #fff,0 4px #eab66e}
.brand:before{content:"👦🏻👧🏻";display:block;font-size:46px;line-height:1.25}
.brand small{display:block;font:600 12px Prompt;color:#184b70;text-shadow:none}
.side a{display:flex;align-items:center;gap:10px;padding:12px 13px;margin:9px 0 0;border:2px solid #fff;border-radius:22px;background:linear-gradient(180deg,#fff,#dff8ff);color:#173d68;text-decoration:none;font:700 16px Mitr;box-shadow:0 5px 0 #91c9d1,0 7px 10px #245b7022}
.side a.active{background:linear-gradient(180deg,#ffe76e,#ff9e12);color:#fff;text-shadow:0 1px #b46a16;box-shadow:0 5px 0 #d47a13}
.main{min-width:0}
.back{display:inline-flex;margin:0 0 12px;padding:9px 15px;border-radius:18px;background:#fff;border:2px solid #fff;box-shadow:0 4px 0 #b5dcca;color:#236078;text-decoration:none;font-weight:700}
.hero{position:relative;display:block;margin:0 0 20px;padding:23px 24px;text-align:center;background:linear-gradient(110deg,#ffe9a8,#ffc46f 55%,#ffe8a0);border:5px solid #fff;border-radius:30px;box-shadow:0 8px 0 #ca914b,0 14px 24px #397e6830;overflow:hidden}
.hero:before{content:"🎬";display:block;font-size:48px;filter:drop-shadow(0 4px 2px #9a6738)}
.hero img{display:none}
.hero h1{margin:0;font:700 clamp(29px,4vw,45px) Mitr;color:#744019;text-shadow:0 3px #fff}
.hero p{margin:4px 0 0;color:#884d2c;font-size:16px;font-weight:600}
#episodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
.episode{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:260px;padding:12px 12px 58px;border:5px solid #fff;border-radius:28px;background:linear-gradient(145deg,#fff,#dffff0);box-shadow:0 8px 0 #81c8a0,0 14px 20px #397e6830;text-align:left;overflow:hidden;transition:transform .18s}
.episode:nth-child(2){background:linear-gradient(145deg,#fff,#ffe2ed);box-shadow:0 8px 0 #df9eb6,0 14px 20px #397e6830}
.episode:nth-child(3){background:linear-gradient(145deg,#fff,#fff0d2);box-shadow:0 8px 0 #dfbd78,0 14px 20px #397e6830}
.episode:nth-child(4){background:linear-gradient(145deg,#fff,#e8e2ff);box-shadow:0 8px 0 #ac9cdd,0 14px 20px #397e6830}
.episode:hover{transform:translateY(-4px)}
.episode .art{width:100%;height:180px;flex:none;margin:0;border:3px solid #fff;border-radius:20px;background-color:#c9f5e6;background-size:cover;background-position:center;box-shadow:inset 0 -8px 0 #0000000d,0 4px 8px #244c3825;font-size:0}
.episode:nth-child(1) .art{background-image:url("assets/story01-illustration-1.svg")}
.episode:nth-child(2) .art{background-image:url("assets/story01-illustration-2.svg")}
.episode:nth-child(3) .art{background-image:url("assets/story01-illustration-3.svg")}
.episode:nth-child(4) .art{background-image:url("assets/story01-illustration-4.svg")}
.episode b{display:block;padding:0 8px;font:700 clamp(18px,2vw,24px) Mitr;color:#344b92}
.episode small{display:block;padding:0 8px;color:#426f68;font-size:14px;font-weight:600}
.episode:after{content:"▶";position:absolute;right:16px;bottom:10px;width:48px;height:48px;display:grid;place-items:center;border:4px solid #fff;border-radius:50%;background:linear-gradient(145deg,#ff8ab1,#ec3679);color:#fff;font-size:19px;box-shadow:0 4px 0 #bf2861}
.viewer{max-width:950px;margin:25px auto;background:#fff;border:5px solid #fff;border-radius:28px;box-shadow:0 8px 0 #8cc9a6}
.scene{position:relative;min-height:300px;border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#b8f0e2,#fff0c6)}
.sceneArt{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.scene h2{position:absolute;z-index:2;left:12px;right:12px;bottom:10px;margin:0;padding:10px 14px;border-radius:18px;background:#ffffffed;color:#285646;box-shadow:0 4px 0 #c5e5d3;font:700 22px Mitr;text-align:center}
.scene .emoji{display:none}
.dialogue{font-size:20px;line-height:1.65}
button{border-radius:18px}
@media(max-width:800px){.wrap{display:block;padding:12px}.side{position:relative;top:auto;display:flex;align-items:center;gap:7px;overflow-x:auto;padding:9px;margin-bottom:14px}.brand{min-width:100px;padding:0;font-size:20px}.brand:before{font-size:22px}.brand small{font-size:9px}.side a{white-space:nowrap;flex:none;margin:0;padding:9px 12px;font-size:13px}.hero{padding:16px}.hero:before{font-size:32px}.hero p{font-size:12px}#episodes{gap:11px}.episode{min-height:205px;padding:8px 8px 48px;border-width:3px;border-radius:21px}.episode .art{height:125px}.episode b{font-size:15px}.episode small{font-size:11px}.episode:after{width:36px;height:36px;right:9px;bottom:7px;font-size:14px;border-width:3px}.viewer{padding:8px}.scene{min-height:210px}.scene h2{font-size:17px}}
@media(max-width:420px){#episodes{grid-template-columns:1fr}.episode .art{height:165px}}
</style></head><body><main class="wrap"><aside class="side"><div class="brand">KIDWISE ✦<small>เข้าใจทุกวัย ใส่ใจทุกการเติบโต</small></div><a href="index.html">🏠 หน้าแรก</a><a href="storybook.html">📚 นิทาน</a><a class="active" href="moral-stories.html">🎬 การ์ตูนสอนใจ</a><a href="games.html">🎮 เกมฝึกทักษะ</a><a href="profile.html">👧 โปรไฟล์เด็ก</a></aside><div class="main"><a class="back" href="index.html">← กลับหน้า KIDWISE</a><header class="hero"><img src="assets/kids.png" alt="เพื่อนตัวน้อย KIDWISE"><h1>🎬 การ์ตูนสอนใจ</h1><p>นิทานภาพสั้น ๆ ชวนเด็กเรียนรู้ความดี ผ่านเรื่องราวใกล้ตัว</p></header>
<section class="grid" id="episodes" aria-label="เลือกตอนการ์ตูน"></section>
<section class="viewer" id="viewer" aria-live="polite"><div class="scene"><div class="sceneArt" id="sceneArt"></div><div><div class="emoji" id="emoji">🌷</div><h2 id="sceneTitle"></h2></div></div><div class="dialogue" id="dialogue"></div><div class="caption" id="counter"></div><div class="progress"><span id="progress"></span></div><div class="controls"><button id="prev">← ย้อนกลับ</button><button class="primary" id="play">▶ อ่านพร้อมเสียง</button><button id="next">ฉากถัดไป →</button><button id="stop">หยุดเสียง</button></div><div class="lesson" id="lesson"></div><div class="controls"><button id="close">กลับไปเลือกตอน</button></div></section>
<p class="small">เสียงอ่านใช้เสียงภาษาไทยที่มีในอุปกรณ์หรือเบราว์เซอร์</p></div></main>
<script>
const stories=[
{title:"ความจริงที่กล้าพูด",sub:"กล้ายอมรับผิดและช่วยกันแก้ไข",cover:"⚽",lesson:"ทำผิดไม่เป็นไร ขอแค่กล้ายอมรับ ขอโทษ และพยายามแก้ไขสิ่งที่ทำผิด",scenes:[["⚽","เล่นบอลในสนาม","ต้นกำลังเล่นฟุตบอลอย่างสนุกสนานกับเพื่อน ๆ ที่สนามโรงเรียน"],["💥","เกิดอุบัติเหตุ","อุ๊ย! ต้นเตะบอลพลาด จนกระถางดอกไม้แตก ต้นตกใจมาก"],["🙋","กล้ายอมรับความจริง","ต้นเดินไปหาคุณครูแล้วบอกว่า ผมทำกระถางแตกเองครับ ผมขอโทษครับ"],["👩‍🏫","ครูชื่นชม","คุณครูยิ้มแล้วพูดว่า ขอบใจที่พูดความจริงนะ ครูภูมิใจในตัวหนู"],["🧹","ช่วยกันแก้ไข","ต้นกับเพื่อนช่วยกันเก็บเศษกระถาง และปลูกดอกไม้ต้นใหม่"],["🌻","เรียนรู้สิ่งดี ๆ","ต้นรู้แล้วว่าการพูดความจริงและรับผิดชอบเป็นสิ่งสำคัญ"]]},
{title:"แบ่งปันด้วยหัวใจ",sub:"รู้จักแบ่งปันและช่วยเหลือเพื่อน",cover:"🎁",lesson:"การแบ่งปันทำให้ทั้งผู้ให้และผู้รับมีความสุข เราแบ่งปันได้แม้เป็นสิ่งเล็ก ๆ",scenes:[["🍱","พักกลางวัน","มะลิเปิดกล่องอาหารกลางวัน เห็นเพื่อนชื่อปันนั่งมองเพื่อน ๆ อย่างเงียบ ๆ"],["🥺","เพื่อนลืมอาหาร","ปันบอกว่า วันนี้เราลืมเอาอาหารมา และยังไม่ได้กินอะไรเลย"],["💗","ชวนแบ่งปัน","มะลิยิ้มแล้วชวนปันมากินแซนด์วิชและผลไม้ด้วยกัน"],["😊","อิ่มใจทั้งคู่","ปันขอบคุณมะลิ ทั้งสองคนนั่งกินอาหารและพูดคุยกันอย่างมีความสุข"],["🤝","เพื่อนช่วยเพื่อน","วันต่อมา ปันช่วยมะลิเก็บหนังสือที่หล่นจากโต๊ะ"],["🌈","น้ำใจส่งต่อได้","ทั้งคู่เรียนรู้ว่า เมื่อเราแบ่งปันและช่วยเหลือกัน ห้องเรียนก็อบอุ่นขึ้น"]]},
{title:"คำสัญญาของฉัน",sub:"ฝึกความรับผิดชอบและรักษาคำพูด",cover:"📚",lesson:"เมื่อเรารับปากว่าจะทำสิ่งใด ควรตั้งใจทำให้สำเร็จ และหากมีปัญหาควรบอกผู้ใหญ่",scenes:[["📝","ให้สัญญา","ภูผาบอกคุณแม่ว่าจะเก็บของเล่นและจัดกระเป๋านักเรียนก่อนเข้านอน"],["🧸","มัวแต่เล่น","หลังกลับบ้าน ภูผาเล่นของเล่นเพลินจนลืมสิ่งที่รับปากไว้"],["🌙","นึกขึ้นได้","ก่อนนอน ภูผาเห็นของเล่นเต็มพื้น จึงนึกถึงคำสัญญาของตัวเอง"],["🧺","ลงมือทำ","ภูผาเริ่มเก็บของเล่นเข้ากล่องและจัดหนังสือใส่กระเป๋า"],["⭐","ทำสำเร็จ","ภูผาจัดทุกอย่างเรียบร้อย คุณแม่ชมที่เขารับผิดชอบคำพูดของตัวเอง"],["💪","ภูมิใจในตัวเอง","ภูผาเรียนรู้ว่าการรักษาคำสัญญาต้องอาศัยความตั้งใจและลงมือทำ"]]},
{title:"เพื่อนใหม่ของฉัน",sub:"ยอมรับความแตกต่างและไม่รังแกกัน",cover:"🧑‍🤝‍🧑",lesson:"ทุกคนแตกต่างกันได้ เราควรให้เกียรติ รับฟัง และชวนเพื่อนทุกคนเล่นด้วยกัน",scenes:[["🏫","เพื่อนใหม่ย้ายมา","วันหนึ่งมีเพื่อนใหม่ชื่อฟ้า ย้ายเข้ามาเรียนในห้องของต้น"],["😟","ยังไม่กล้าเข้ากลุ่ม","ฟ้ายืนมองเพื่อนเล่นอยู่ห่าง ๆ เพราะยังไม่รู้จักใคร"],["👋","ชวนเล่นด้วยกัน","ต้นเดินเข้าไปทักทายและชวนฟ้ามาเล่นเกมด้วยกัน"],["🧩","เล่นเป็นทีม","เพื่อน ๆ ช่วยกันต่อภาพจิ๊กซอว์ ทุกคนได้เสนอความคิดของตัวเอง"],["💬","รับฟังกัน","เมื่อมีความเห็นไม่เหมือนกัน เด็ก ๆ ผลัดกันพูดและรับฟังอย่างสุภาพ"],["❤️","ห้องเรียนที่อบอุ่น","ฟ้ามีเพื่อนใหม่ ทุกคนเข้าใจว่าเราแตกต่างกันแต่เป็นเพื่อนกันได้"]]}
];
let storyIndex=0,sceneIndex=0,playing=false;
const $=id=>document.getElementById(id);
function buildCards(){$("episodes").innerHTML=stories.map((s,i)=>'<button class="episode" data-story="'+i+'"><div class="art">'+s.cover+'</div><b>ตอนที่ '+(i+1)+' · '+s.title+'</b><small>'+s.sub+'</small></button>').join("");document.querySelectorAll("[data-story]").forEach(b=>b.addEventListener("click",()=>openStory(Number(b.dataset.story))))}
function render(){const s=stories[storyIndex],v=s.scenes[sceneIndex];$("emoji").textContent=v[0];$("sceneTitle").textContent=v[1];const positions=["0% 0%","50% 0%","100% 0%","0% 100%","50% 100%","100% 100%"];const art=$("sceneArt");art.style.backgroundImage=storyIndex===0?"url(assets/moral-cartoon-episode1-hd-opt.jpg)":storyIndex===1?"url(assets/story01-pages-sprite.webp)":"url(assets/kids.png)";art.style.backgroundSize=storyIndex===0?"300% 200%":"cover";art.style.backgroundPosition=storyIndex===0?positions[sceneIndex]:storyIndex===1?"center":["center","left center","right center","center top","center bottom","center"][sceneIndex];$("dialogue").textContent=v[2];$("counter").textContent="ตอนที่ "+(storyIndex+1)+" · ฉากที่ "+(sceneIndex+1)+" / 6";$("progress").style.width=((sceneIndex+1)/6*100)+"%";$("lesson").innerHTML="<b>💡 ข้อคิดท้ายเรื่อง</b><br>"+s.lesson;$("prev").disabled=sceneIndex===0;$("next").disabled=sceneIndex===5;$("play").textContent=playing?"กำลังอ่านเสียง…":"▶ อ่านพร้อมเสียง"}
function openStory(i){stop();storyIndex=i;sceneIndex=0;$("viewer").classList.add("show");$("episodes").style.display="none";render();$("viewer").scrollIntoView({behavior:"smooth",block:"start"})}
function stop(){playing=false;if("speechSynthesis"in window)speechSynthesis.cancel();if($("viewer").classList.contains("show"))render()}
function speak(){if(!("speechSynthesis"in window)){alert("อุปกรณ์นี้ยังไม่รองรับเสียงอ่าน");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(stories[storyIndex].scenes[sceneIndex][2]);u.lang="th-TH";u.rate=.9;u.pitch=1.08;u.onend=()=>{if(!playing)return;if(sceneIndex<5){sceneIndex++;render();speak()}else{playing=false;render()}};speechSynthesis.speak(u)}
$("play").onclick=()=>{playing=true;render();speak()};$("stop").onclick=stop;$("next").onclick=()=>{stop();sceneIndex=Math.min(5,sceneIndex+1);render()};$("prev").onclick=()=>{stop();sceneIndex=Math.max(0,sceneIndex-1);render()};$("close").onclick=()=>{stop();$("viewer").classList.remove("show");$("episodes").style.display="grid";$("episodes").scrollIntoView({behavior:"smooth"})};buildCards();
</script></body></html>
